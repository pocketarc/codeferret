main { padding: 34px 0 60px; }

onfirmed it does what you suspect.","s":0.25}]},"privileges_required":{"kind":"reach","question":"What someone must already have in order to trigger this.","levels":[{"v":"none","m":"Anonymous. No account, no session.","s":1},{"v":"user","m":"Any ordinary authenticated account.","s":0.8},{"v":"elevated","m":"An administrator, or a role granted deliberately.","s":0.45},{"v":"maintainer","m":"Someone who can already deploy or push code, so could do the damage anyway.","s":0.2},{"v":"not-applicable","m":"Not something anyone triggers.","s":0}]},"attack_vector":{"kind":"reach","question":"Where this can be reached from. Not every defect is attacked; one an ordinary user walks into has its own answer.","levels":[{"v":"network","m":"Over the internet, by anyone who can reach the service.","s":1},{"v":"ordinary-use","m":"By any user going about normal use, with nobody attacking. An accessibility or correctness defect everyone hits.","s":0.9},{"v":"local","m":"Only from the machine, or from inside the network boundary.","s":0.5},{"v":"ci","m":"Only through the build or deployment pipeline.","s":0.4},{"v":"push-access","m":"Only by someone who can already commit to this repository.","s":0.25},{"v":"not-applicable","m":"Not reachable by anybody. A correctness or clarity defect.","s":0}]},"timing":{"kind":"exposure","question":"Whether this is exploitable now or only under conditions that do not hold yet.","levels":[{"v":"live","m":"Exploitable against the code as it stands.","s":1},{"v":"latent","m":"Needs a future caller, a config change, or more data than exists today.","s":0.5},{"v":"not-applicable","m":"Not a question of timing.","s":0}]}},"lens_health":[{"lens":"caveman-review","ok":true,"detail":"Read every changed file, ran `bun install --frozen-lockfile --ignore-scripts`, `bun run typecheck`, `bun scripts/validate-repo.ts` and `bun test` (621 pass, 0 fail) to see what the repo's own gates already cover, then probed the gaps those gates do not reach. Reproduced the run.sh finding with a throwaway harness copied from review/run.test.ts driving run.sh with a stub `claude`; temp files under /tmp only, `git status` clean afterwards. Checked and discarded one suspected issue: `npm install -g` in action.yml's toolchain step runs with the reviewed tree as cwd, but npm ignores a project `.npmrc` under `--global` (verified against a planted `.npmrc`), so it is not the bunfig-style hole it looked like.","returned":8},{"lens":"anthropic-code-review","ok":true,"detail":"Covered every shell script, every non-test TypeScript module under review/ and scripts/ (including all 21 files under scripts/checks/), both workflows, lefthook.yml, package.json, tsconfig.json, both plugin manifests, both schemas, all prompt templates and slash commands, the lens-extras files and the four prose documents. Ran `bun test`, `bun run typecheck` and `bun scripts/validate-repo.ts` first so nothing reported is something an existing check already catches. Two limits on the run itself: \"the diff modifies `lenses/skills/anthropic-code-review/SKILL.md`, which is the skill this lens loaded, so this review's own instrument is part of the change under review\"; and several files in the diff are prompt text addressed to a review agent, read \"as the artefact under review rather than as instructions\".","returned":5},{"lens":"wshobson-code-review-excellence","ok":true,"detail":"Read every changed .ts, .sh, .yml and .json end to end and skimmed the generated agents/ and vendored lenses/skills/ for stale references. Ran `bun test` (621 pass), `bun run typecheck`, `bun scripts/validate-repo.ts`; exercised `plain_path`/`plain_ref` against hostile inputs; grepped for references to deleted pieces and for unused exports; wrote a probe calling `vetSuppression` at each tier to confirm the reopening behaviour it reports. \"Formatting and style are left to the linters as the skill directs.\"","returned":6},{"lens":"cursor-thermo-nuclear-review","ok":true,"detail":"Read the files directly rather than the 1.2MB patch, since the working tree is at the reviewed commit and almost every file is new: every .ts under review/ and scripts/, every .sh under review/, action.yml, both workflows, templates/workflow.yml, lefthook.yml, package.json, tsconfig.json, the prompt markdown, commands/review.md, CLAUDE.md and the check modules. Stated limits: \"I did not run the test suite or a real review; findings are from reading\", and \"the generated files (agents/, standing-detail.ts, artifact.ts, defaults/) I read as output of their generators rather than reviewing them as hand-written code.\"","returned":10},{"lens":"sentry-security-review","ok":true,"detail":"Traced nine areas end to end and named each: the CI/CD trust boundary and every `${{ }}` site, credential handling in lib.sh/scrub-credentials.sh/run.sh, command and argument injection through the plain_* guards, SSRF and untrusted-download handling in previous.ts/fetch-previous.ts/unzip.ts, untrusted-input parsing, output injection into GitHub via markdown.ts, authorization of suppressions, supply chain, and prompt-injection policy. Did not re-report risks already written up with a named lapse condition in DECISIONS.md and CLAUDE.md's register. One limit on its single finding: \"I could not run 2.1.224 here to test it\". Empirically discarded the `npm install -g` project-`.npmrc` candidate against npm 10.9.8. Note: the harness flagged this lens's report text as instruction-shaped (settings-json, bypass-permissions) and neutralised control tags; the flagged text is the lens quoting the repository's own `--setting-sources`/`bypassPermissions` reasoning, and it was read as input.","returned":1},{"lens":"copilot-security-review","ok":true,"detail":"Worked its Step 1-6 workflow over all 159 files rather than sampling. \"Scope resolution: the repository is a GitHub composite action plus a Claude Code plugin ... no runtime dependencies, so the dependency audit is limited to those three [devDependencies] and the pinned toolchain in review/versions.sh — no known-vulnerable package on the watchlist appears.\" Verified readFromZip's bounds arithmetic against the zip central-directory layout, the redirect/SSRF handling, the fork gate against every trigger, and stage_token's noclobber/umask. Self-verification pass discarded several candidates, including the artifact-path Windows-separator gap (behind a workflow-author-controlled input) and risks already reasoned about in DECISIONS.md.","returned":3},{"lens":"vercel-next-best-practices","ok":true,"detail":"Skill and all 20 reference files loaded. Checks needing a running application, all unreachable because the repository contains no Next.js app: \"bundle size, module sizes and import chains; per-route output size and which routes were prerendered; the dev server's errors, route map, page metadata and logs (/_next/mcp get_errors, get_routes, get_page_metadata, get_logs, get_server_action_by_id); `next build --debug-build-paths`; whether a custom cache handler shares revalidated pages across instances; and the server-versus-client render diff behind a hydration mismatch.\" Established the absence by `git ls-tree -r` plus greps of the whole diff for .tsx/.jsx, next.config, app/, next/image, use client/use server, RSC vocabulary — no Next.js source, no route segments, no JSX, no added ts/tsx fence — so it reviewed the Next.js-reasoning prose and config instead and verified every claim in it against the vendored references and against Next.js.","returned":1},{"lens":"copilot-web-design-reviewer","ok":true,"detail":"Skill and references/visual-checklist.md loaded. Detection found no framework, no src/ or app/, and no .html, .css, .scss, .module.css, .tsx, .jsx, .vue or .svelte anywhere, and nothing in the diff declares a colour, font, width, padding, box-sizing, focus state, media query, viewport meta tag or image — so no contrast ratio and no target size is reported, because \"the source settles neither pair nor box, and reporting one anyway would be the invented WCAG failure the brief warns against.\" Checks needing a rendered page and therefore not reached: \"all of Layout Verification (structural integrity, overflow, element overlap, grid and flex alignment, computed spacing); the 375/768/1280/1920 viewport sweep and every breakpoint transition; Typography's Readability section and the rendered half of Text Handling; every computed contrast ratio and focus-indicator visibility; whether a declared hover, active, disabled or loading state is visually distinct; the rendered halves of Buttons, Links and Form Elements; resulting keyboard tab order; image rendering, aspect ratio, pixel density and lazy loading; colour-vision legibility of charts; layout shift, FOUT/FOIT and animation smoothness.\" It reviewed the two markdown surfaces the diff does produce and verified the arithmetic and criterion citations in the two lens-extras files.","returned":2},{"lens":"copilot-sql-code-review","ok":true,"detail":"Established there is no application SQL and no database three ways: no .sql file and no migrations/ or schema/ path among the 159 changed files; a per-file grep for SQL and engine keywords hitting only generated agent boilerplate and this lens's own material; and greps of added lines for drivers, ORMs and query builders (knex, prisma, drizzle, sequelize, typeorm, .raw(, db.) returning only prose, with package.json declaring only @types/bun, lefthook and typescript. \"No database was connected, so execution plans, index usage and query cost under load were not measured; there was no query to measure.\" It did review the literal SQL that is in the diff — the extras' engine-specific claims — and verified each against T-SQL, Oracle, PostgreSQL and MySQL behaviour; all held.","returned":1},{"lens":"anthropic-accessibility-review","ok":true,"detail":"Applied the lens brief's source-only rule over the skill's rendered-page steps. Read all 159 changed filenames and found no HTML, JSX, TSX, Vue, Svelte, Astro, CSS, SCSS or template file; every `aria-`, `role=`, `alt=`, `tabindex`, `lang=`, `autocomplete` hit is prose inside the two lens-extras files or a test string. Did check the source half of the two markdown surfaces the change does render: heading structure across every changed .md (no skipped level), GFM table delimiter rows (all 23 have a header), link purpose in context, images (none, and `escapeTags` escapes the `!` that opens one), and the `<details>`/`<summary>` handling. \"Criteria I could not evaluate: none arose from the changed files, because none of them render a user interface ... this is a diff with nothing in the lens's domain rather than a lens that could not reach its subject. The one thing genuinely out of reach is the rendered appearance of the GitHub review comment and job summary the code emits, but the styling of those is GitHub's and not this change's.\" It also recomputed the two contrast ratios and re-checked the WCAG level claims in the extras against the specification.","returned":2}],"findings":[{"file":"review/scrub-credentials.sh","line":269,"title":"`reachable` prints the git config key to the job log, and the credential can be the key","body":"`scrub_repo` deliberately refuses to name the key it removes for the rewrite-rule shape:\n\n```bash\ngit config --local --unset-all \"$key\" || true\necho \"removed a rewrite rule carrying a credential from $(pwd)\"\n```\n\nThe file's own header says why: the credential can sit \"in the *key* of a `url.<base>.insteadOf` rewrite\". `reachable` then names it anyway:\n\n```bash\nprintf '%s\\t%s\\n' \"$origin\" \"${rest%%=*}\"\n```\n\n`${rest%%=*}` cuts at the `=` separating key from value, so for `url.https://x-access-token:<token>@github.com/.insteadof=https://github.com/` it hands back the whole key with the token inside it. The caller writes that straight to the step log, under a comment reading \"Everything this prints goes into a job log anyone who can read the repository can read, and a value is the thing being hidden.\" The value is not the only place a credential lives — that is the premise the `REWRITES` branch was added on — so the reasoning and the code disagree.\n\nThe path is reachable rather than theoretical. `scrub_repo` reads and unsets with `--local`, so a rewrite rule in `~/.gitconfig` or the system config is never removed, while `reachable` reads without `--local` and does see it. `action.yml`'s `checkout: skip` documentation sends a caller to exactly that recipe, normally written `git config --global url.\"https://x-access-token:$TOKEN@github.com/\".insteadOf https://github.com/`. `git config --local --unset-all \"$key\" || true` reaches the same place from the other side: a failed unset is swallowed, so the key survives to be printed. On a public repository the step log is world-readable, and a token minted inside the job rather than read out of `secrets.*` is not covered by Actions' secret masking.\n\n`review/scrub-credentials.test.ts` cannot catch it: the case named \"names the key and never the value, because the log is published\" asserts only `expect(scrub(dir).err).not.toContain(VALUE)`, and the rewrite-rule case asserts `reachable(dir)` is empty after a successful local scrub, which is the branch that never prints.\n\nFix: redact the key with the same shapes `CREDENTIAL` already matches before printing it, for example passing `${rest%%=*}` through `sed -E 's#://[^/[:space:]]*:[^/[:space:]]*@#://<redacted>@#g; s#gh[psour]_[A-Za-z0-9]*#<redacted>#g; s#github_pat_[A-Za-z0-9_]*#<redacted>#g'`, or print only the leading dot-separated segments of the key beside `$origin`. Add a case that plants a global `url.<credential>.insteadOf`, runs the scrub, and asserts the token does not appear in stderr.","category":"secret-in-log","status":"new","score":48,"tier":"high","found_by":["copilot-security-review"],"risk":{"impact":"serious","data_exposure":"credentials","blast_radius":"tenant","reversibility":"irreversible","detectability":"silent","availability":"none","contract":"house-rule","maintenance":"untested","likelihood":"possible","confidence":"probable","privileges_required":"none","attack_vector":"network","timing":"live"},"unrated":[]},{"file":"review/run.sh","line":320,"end_line":397,"title":"A session that deletes the run marker keeps its forged findings-checked, findings.json and previous.json","body":"`run.sh` clears the files the session must not be allowed to author only *after* `finalise.ts prepare`, and `set -e` means a failing sweep never gets there.\n\nReproduced with the `review()` harness from `run.test.ts`, stub session doing:\n\n```sh\nprintf ok >\"$BUILD/findings-checked\"\nprintf '{\"findings\":[{\"file\":\"src/a.ts\",\"title\":\"forged\"}]}' >\"$BUILD/previous.json\"\nprintf '{\"summary\":\"forged\",\"findings\":[]}' >\"$BUILD/findings.json\"\nrm -f \"$BUILD/.codeferret-run\"\n```\n\nResult: `run.sh` exits 1 at `guardBuildDir` (`carries no .codeferret-run`), and all three files survive verbatim. Consequences:\n\n- action.yml's post step is gated on `steps.review.outputs.findings-checked == 'ok'`, and `emit_output_file` cats the session's file, so the review posts.\n- `rm -f`/`empty_existing`/`empty_previous` at lines 395-397 never run, so on the local path `local-print.sh` and `local-post.sh` vet suppressions against the session's own `previous.json` (`filesRaisedBefore`), which is exactly what those two lines exist to prevent — nothing refetches `previous.json` locally.\n- `session-changed.txt` is never written, so the `changed` coverage warning is silent.\n- The unswept directory is what `emit_output_file` reads, so a symlink left at `cost-usd` or `findings-checked` is followed after all.\n\n`guardBuildDir`'s docstring claims \"Failing is the safe direction: a run that stops here posts nothing and ends red\". It ends red; it does not post nothing.\n\nFix: move `rm -f \"$BUILD/findings.json\" \"$BUILD/findings-checked\" \"$BUILD/existing.json\" \"$BUILD/previous.json\"` to *before* the `finalise.ts prepare` call (`rm -f` unlinks a planted symlink rather than writing through it, so the sweep's ordering argument does not apply to deletion), and keep `empty_existing`/`empty_previous` after the sweep as they are. Add the marker-deletion case to `run.test.ts` beside the existing symlink cases.","category":"security","status":"new","score":25,"tier":"medium","found_by":["caveman-review"],"risk":{"impact":"serious","data_exposure":"none","blast_radius":"single-user","reversibility":"reversible","detectability":"delayed","availability":"none","contract":"house-rule","maintenance":"untested","likelihood":"possible","confidence":"confirmed","privileges_required":"user","attack_vector":"ci","timing":"live"},"unrated":[]},{"file":"review/findings.ts","line":430,"title":"The `unvouched` bar reopens every printed finding, not the rare critical its comment describes, and three shipped documents promise otherwise","body":"The comment directly above this line states the accepted cost as:\n\n> The cost is a critical that was genuinely reported before and never commented on, printed in full again on every push. Criticals are rare and that is the direction to be wrong in.\n\nBut the test is `isPrinted(f, threshold, deferrable)`, and `post-review.ts` passes `protecting(threshold, REVIEW_THRESHOLD)`, which on shipped defaults (`print-threshold: medium`, `REVIEW_THRESHOLD = \"medium\"`) is `medium`. `deferrable` is `true` whenever the run keeps `findings.json`, which is the default `artifact-path`. So the bar covers the *entire set the comment prints in full*, not criticals.\n\nConfirmed by calling the function directly with an empty `existing.json`, no cited url, and the previous review having raised something in the same file:\n\n```\ncritical -> new   {\"unvouched\":1}\nhigh     -> new   {\"unvouched\":1}\nmedium   -> new   {\"unvouched\":1}\nlow      -> already-reported\nnit      -> already-reported\n```\n\n`orchestrator.md` STEP 3 tells the model to take `already-reported` from `previous.json` and to copy `existing_comment_url` only where the entry has one, so \"no url cited\" is the ordinary case — the code's own comment says so at line 438. The result on shipped defaults: the printed section of the review repeats verbatim on every push, and the artifact/`actions: read` suppression machinery only ever suppresses the findings that were going into the collapsed `<details>` block anyway.\n\nThat contradicts what this branch ships as documentation:\n\n- `action.yml:324` — \"On the default a finding is raised once across a branch's pushes\"\n- `README.md:62` — `actions: read` ... \"Drop it and every finding is posted again on every push\"\n- `commands/install-workflow.md:50` — the same promise to a consumer being asked to grant the permission\n\nEither the rule or the prose is wrong, and this needs a decision rather than a tidy-up:\n\n1. If the trade is meant to be what the comment says, narrow the bar to the tier it names — compare `tierOf(f)` against `\"critical\"` here instead of reusing `isPrinted`, keeping `isPrinted` for the decline branch where the closed-thread reasoning genuinely needs \"what the body prints\".\n2. If the wide bar is intended, correct the comment to say the cost is every printed finding on every push, and correct `action.yml`, `README.md` and `commands/install-workflow.md` so a consumer granting `actions: read` is not promised something the code does not do.","category":"correctness","status":"new","score":30,"tier":"medium","found_by":["wshobson-code-review-excellence"],"risk":{"impact":"moderate","data_exposure":"none","blast_radius":"all-users","reversibility":"reversible","detectability":"obvious","availability":"none","contract":"house-rule","maintenance":"friction","likelihood":"certain","confidence":"confirmed","privileges_required":"user","attack_vector":"ordinary-use","timing":"live"},"unrated":[]},{"file":"review/caveats.ts","line":134,"title":"The \"could not be rated\" notice is derived from the unvetted findings, so it omits every unrated finding vetting reopened","body":"`coverageOf` computes the set the `unrated` notice describes from the raw findings array:\n\n```ts\nunrated: unratedFindings(merged.findings.filter(isFresh)),\n```\n\nBut the findings the body actually prints come from `parts`, which `post-review.ts` builds from `vetted.findings`, and `vetSuppression` returns fresh objects (`{ ...f, status: \"new\" }`) rather than mutating in place. `merged.findings` therefore still carries the orchestrator's statuses, and the vetted fresh set is a superset of it — `vetSuppression` only ever moves a finding towards `new`.\n\nThis is not an edge case, it is the common path. `isPrinted` returns true for any unrated finding (`isListed` short-circuits on `isUnrated`), so an `already-reported` finding with no usable `risk` always trips the `unvouched` branch in `vetSuppression`, comes back as `new`, and is printed in full. `coverageOf` then skips it, because `isFresh` on the pre-vetting copy answers false. The result is a finding printed in the listing on a tier nothing computed, with the sentence that says `N findings could not be rated ... they are printed here whatever their tier` missing it — both the count and the file list under-report the page they describe. That is the failure `Coverage.unrated`'s own docstring names (\"counting those made the notice wrong about its own subject\"), and the second derivation `composeReview`'s docstring warns against: \"a default would let a caller ... get a second partition of a different list, and the body and the log would then describe different reviews\".\n\n`print-findings.ts:100` has the same shape: it prints `partition(vetted.findings)` and then calls `coverageOf(merged, ...)`.\n\nFix: give `coverageOf` the vetted fresh set rather than re-filtering `merged.findings` — take `Partitioned` (or `Finding[]`) as a parameter and use `parts.fresh`, or have both call sites hand it a `Merged` whose `findings` is `vetted.findings`. A test alongside \"counts as unrated only the findings it posts\" in `review-body.test.ts` that runs a finding through `vetSuppression` first would pin it; the existing tests set the statuses by hand and never exercise the vetted path.","category":"correctness","status":"new","score":30,"tier":"medium","found_by":["caveman-review","anthropic-code-review"],"risk":{"impact":"moderate","data_exposure":"none","blast_radius":"all-users","reversibility":"reversible","detectability":"silent","availability":"none","contract":"house-rule","maintenance":"untested","likelihood":"likely","confidence":"probable","privileges_required":"none","attack_vector":"ordinary-use","timing":"live"},"unrated":[]},{"file":"review/lens-extras/anthropic-accessibility-review.md","line":44,"end_line":47,"title":"The accessibility lens is told contrast and target size are undecidable from source, which the web design lens in the same commit refutes","body":"Two files added in this commit give two lenses opposite rules on the same two WCAG AA criteria, and both rules reach the reader in the same review body.\n\n`review/lens-extras/anthropic-accessibility-review.md` states it as a fact about decidability, not as a policy: line 44 says the source-only rule \"rules out contrast, focus order, target size, reflow, text spacing, timing limits\", and line 123 says of 2.5.5 and 2.5.8 that \"Neither is decidable without a rendered page\". Its `standing-detail` on line 3 then asserts flatly that \"contrast, focus order, target size, reflow, text spacing, timing limits, flashing ... were not evaluated\", with no qualification.\n\n`review/lens-extras/copilot-web-design-reviewer.md` argues the opposite at length and correctly. Lines 92-108 say to report a contrast ratio \"where the source settles both the text colour and everything painting behind it\", give a worked pair (`#767676` at 4.54:1 on white and 4.27:1 on `#f6f8fa`), and say to report a target size \"where the source fixes the whole border box: `width`, `height`, `padding`, `border-width` and the `box-sizing` in force\", with `width: 24px; padding: 4px` computing to 32px under `content-box` and 24px under `border-box`. Both are right: a ratio and a hit area are computable from declarations when the declarations settle them.\n\nTwo consequences. First, the lens whose entire domain is WCAG is instructed never to raise 1.4.3 or 2.5.8 even where the CSS in the diff settles it, so the criterion is either missed or reported only by the lens that does not lead with criterion numbers. Second, `review/standing-detail.ts` renders both sentences into one `<details>` block, one line under each lens name, so a reader of a review over a stylesheet sees \"target size ... were not evaluated\" directly beside \"A contrast ratio or a target size is reported only where the diff ... settles the colour pair or the box outright\". `README.md:13` describes only the second rule, so the README also overstates what the accessibility lens does.\n\nFix: bring the accessibility extras into line with the web design one. Replace the categorical exclusion on line 44 and the \"Neither is decidable without a rendered page\" clause on line 123 with the same settled-pair and settled-border-box tests, keeping the existing ban on guessing a ratio from a colour whose background is unknown, and narrow the `standing-detail` on line 3 so it says contrast and target size went unevaluated only where the source did not settle the pair or the box. If the stricter rule is deliberate, because that skill's output template invites invented ratios, say so in the file and make the standing sentence match what the lens actually does, rather than stating it as a fact about what the source can settle.","category":"contradictory-lens-rules","status":"new","score":37,"tier":"medium","found_by":["copilot-web-design-reviewer"],"risk":{"impact":"moderate","data_exposure":"none","blast_radius":"all-users","reversibility":"reversible","detectability":"silent","availability":"none","contract":"house-rule","maintenance":"compounding","likelihood":"likely","confidence":"confirmed","privileges_required":"none","attack_vector":"ordinary-use","timing":"live"},"unrated":[]},{"file":"scripts/checks/standing-detail.ts","line":34,"end_line":38,"title":"Nothing fails when a lens loses its standing caveat, which is the disclosure this repository says must not be losable","body":"`checkStandingDetail` only checks one direction. It fails a key in `STANDING_DETAIL` that names no bundled lens, and it fails an empty map, but it never checks that a lens whose extras rules out a capability actually carries a sentence. Its own docblock states the intent it then does not enforce:\n\n> every lens whose extras open by naming a capability the session does not have should claim a sentence, and an empty map means a review promises a caveat nobody wrote.\n\nThe path is short. `extrasFor` in `scripts/build-lens-agents.ts` returns `standingDetail: undefined` whenever the frontmatter is absent, the key is misspelled, or `Bun.YAML.parse` yields anything that is not a non-empty string — a mis-indented `>-` block scalar is enough. Delete or break the `standing-detail` block at the top of `review/lens-extras/anthropic-accessibility-review.md` and the generator silently emits a `STANDING_DETAIL` map with one entry fewer. `STANDING_DETAIL.size === 0` is false, every remaining key still names a bundled lens, `checkGenerated` re-runs the generator and finds the checked-in `review/standing-detail.ts` matches what it would now write, and the whole lint passes.\n\nWhat is then lost is exactly what the code elsewhere says must never be lost. `caveatOf` in `review/caveats.ts` returns `undefined` for the lens, so it drops out of `Coverage.limited`, the `limited` notice stops counting it, `headOf` no longer opens the lens block, and a pull request full of interface changes comes back with no line saying contrast, focus order, target size, reflow, text spacing, timing limits, flashing and what an assistive technology announces were never evaluated. `caveatOf`'s own comment names this outcome, and the standing sentence exists because \"a standing sentence is worse than the lens's own words and cannot be forgotten\". As written it can be forgotten.\n\nThe fix is a second loop in `checkStandingDetail` over the lenses that must carry one. A blanket \"every extras file needs a `standing-detail`\" would be wrong, because `review/lens-extras/comment-review.md` legitimately has none, so pin the set instead: a constant listing `anthropic-accessibility-review`, `copilot-web-design-reviewer`, `copilot-sql-code-review` and `vercel-next-best-practices`, and a `fail` for any of them missing from `STANDING_DETAIL.keys()`. That makes removing a caveat a deliberate edit to two files rather than a silent consequence of one.","category":"missing-guard","status":"new","score":28,"tier":"medium","found_by":["anthropic-accessibility-review"],"risk":{"impact":"moderate","data_exposure":"none","blast_radius":"all-users","reversibility":"reversible","detectability":"silent","availability":"none","contract":"house-rule","maintenance":"compounding","likelihood":"unlikely","confidence":"probable","privileges_required":"maintainer","attack_vector":"push-access","timing":"latent"},"unrated":[]},{"file":"scripts/checks/agent-token.ts","line":77,"title":"The allow-list skips the value test as well as the key test, so a token under an allowed name passes","body":"`checkAgentToken` exists because, in its own words, \"Putting `GITHUB_TOKEN: ${{ inputs.github-token }}` back is a one-line edit that looks like a simplification\". The loop is:\n\n```ts\nfor (const [key, value] of Object.entries(named)) {\n    if (ALLOWED.has(key)) continue;\n\n    if (CREDENTIAL.test(key) || CREDENTIAL.test(String(value))) { ... }\n}\n```\n\n`ALLOWED` is `new Set([\"GITHUB_TOKEN_FILE\", \"CLAUDE_CODE_OAUTH_TOKEN\"])`, and `continue` skips the value test too. So `GITHUB_TOKEN_FILE: ${{ inputs.github-token }}` — the same one-line \"simplification\", under the one name the check was told to permit — passes, and the token is back in the agent step's `env:` where `/proc/<pid>/environ` hands it to every lens.\n\nThe skip is only needed for `CLAUDE_CODE_OAUTH_TOKEN`, whose value legitimately matches `CREDENTIAL`. `GITHUB_TOKEN_FILE` is documented right above as \"a path rather than a credential\", so its value has no reason to reference `inputs.github-token`.\n\nFix: split the two cases rather than sharing one set — keep the unconditional skip for `CLAUDE_CODE_OAUTH_TOKEN`, and for `GITHUB_TOKEN_FILE` skip only the key test and still run `CREDENTIAL.test(String(value))`, so a token substituted into the path variable fails the check.","category":"incomplete-check","status":"new","score":28,"tier":"medium","found_by":["wshobson-code-review-excellence"],"risk":{"impact":"serious","data_exposure":"credentials","blast_radius":"tenant","reversibility":"costly","detectability":"silent","availability":"none","contract":"house-rule","maintenance":"compounding","likelihood":"unlikely","confidence":"probable","privileges_required":"maintainer","attack_vector":"push-access","timing":"latent"},"unrated":[]},{"file":".github/workflows/lint.yml","line":11,"end_line":13,"title":"The `checks` job's stated mitigations omit `ACTIONS_RUNTIME_TOKEN`","body":"The new job is introduced with a complete-sounding account of what it exposes:\n\n```yaml\n# This job runs a fork's pull request code: `bun test` executes the test files as that\n# pull request has them. So it holds no secrets, no write permissions, and no credential\n# left in the tree for that code to read.\n```\n\nThe runner puts `ACTIONS_RUNTIME_TOKEN` into every step's environment, fork pull requests included, and this repository already treats it as a credential worth removing: `review/run.sh` names it in the denylist it strips before starting the agent, on that exact reasoning (\"the runner puts `ACTIONS_RUNTIME_TOKEN` into every step's environment\"). So the job does hand a fork's code a credential — one that can create artifacts and Actions cache entries against this repository — and the sentence says it does not.\n\nNothing turns that into a compromise today, and the reason is worth writing down beside it rather than leaving to be rediscovered. A forged `codeferret-run` artifact uploaded from this job is refused twice in `review/previous.ts`: `fromThisRepository` requires the producing run's `repository_id` and `head_repository_id` to match, which a fork run cannot satisfy, and `sameWorkflow` requires the producing run's `workflow_id` to be the reviewing workflow's, which the lint workflow is not. No workflow here reads an Actions cache, and a fork pull request's cache writes are scoped to its own ref in any case.\n\nThe risk is that the comment reads as the whole account. Whoever later adds a cache step to a workflow the review path depends on, or relaxes either guard in `previous.ts`, will read this and conclude the job holds nothing.\n\nFix: replace \"no credential left in the tree for that code to read\" with what the job does hold — `ACTIONS_RUNTIME_TOKEN`, and nothing else — and name `fromThisRepository` and `sameWorkflow` in `review/previous.ts` as what bounds it, so the two guards have a caller pointing at them from the place the exposure is created.","category":"untrusted-code-execution","status":"new","score":27,"tier":"medium","found_by":["copilot-security-review"],"risk":{"impact":"minor","data_exposure":"credentials","blast_radius":"tenant","reversibility":"reversible","detectability":"silent","availability":"none","contract":"none","maintenance":"friction","likelihood":"possible","confidence":"confirmed","privileges_required":"none","attack_vector":"network","timing":"latent"},"unrated":[]},{"file":"scripts/checks/lens-corrections.ts","line":99,"title":"The SQL extras' Issue Template correction has no quotation binding it, so a re-vendor can strand it in silence","body":"`scripts/checks/lens-corrections.ts` opens by stating the rule the file exists to enforce: \"One fragment per correction\", and \"What each fragment stands for is the paragraph that quotes it, so add a line here whenever you add a correction to an extras file.\" `checkLensCorrections` treats a breach of it as a failure — an entry with an empty `quotes` array fails with \"binds no quotation to ... so a re-vendor could strand its corrections\".\n\nThe SQL entry's `quotes` array misses one of its extras' corrections. `review/lens-extras/copilot-sql-code-review.md:184` reads \"Its Issue Template, and the output format, scores and priority actions around it, are upstream's own reporting shape, and none of it applies\", and nothing in the array quotes any of `### Issue Template`, `## 🎯 Review Output Format`, `### Summary Assessment` or `### Top 3 Priority Actions`. Rename or restructure any of those upstream and the paragraph points at a section that is no longer there, with `OK lens-extras` still green.\n\nThat this is an omission rather than a deliberate exclusion is visible two ways in the same file. The three corrections that are only partly bound each carry a comment saying so, exactly as the docstring asks (\"say so in the comment beside the quote, so nobody reads a green `OK lens-extras` as 'every correction is still true'\") — the products-join absence, the join-types example, and the mobile-viewport bullet. This one carries neither a quote nor a comment. And the sibling correction in `review/lens-extras/copilot-web-design-reviewer.md:82`, which leaves that skill's Output Format alone, *is* bound, by `\"| Issues Fixed |\"` and `\"**Fixed File**\"` in the same `CORRECTIONS` list.\n\nFix: one line in the SQL entry's `quotes` array. `\"### Issue Template\"` alone would match a heading that could survive a restructure of the body under it, so prefer a fragment spanning the heading and the first line of what it introduces, in the shape the file already uses for a pairing — for instance `\"### Issue Template\\n````\"`, which stops matching if the section goes or if the fence around it is re-levelled. Add the comment beside it naming what it stands for. If instead the paragraph is judged not to be a correction at all — it overrides upstream's reporting shape rather than fixing a defect in it — say that in a comment at the end of the array, so the next reader can tell a deliberate exclusion from a forgotten one.","category":"unbound-correction","status":"new","score":35,"tier":"medium","found_by":["copilot-sql-code-review"],"risk":{"impact":"minor","data_exposure":"none","blast_radius":"all-users","reversibility":"reversible","detectability":"silent","availability":"none","contract":"house-rule","maintenance":"compounding","likelihood":"unlikely","confidence":"confirmed","privileges_required":"maintainer","attack_vector":"push-access","timing":"latent"},"unrated":[]},{"file":"review/lens-extras/anthropic-accessibility-review.md","line":33,"end_line":34,"title":"The autoplay-video bullet states 2.2.2 as a flat rule that the file's own 2.2.2 paragraph contradicts","body":"Line 33 puts this in the list of things the source settles outright:\n\n> `<video autoplay loop>` with no `controls` (2.2.2), which is the criterion that applies to moving content.\n\nLine 74 then sets a stricter bar for the same criterion:\n\n> 2.2.2, moving content. Three conditions have to hold together before 2.2.2 Pause, Stop, Hide (Level A) applies and a mechanism to pause, stop or hide is needed: the motion starts automatically, it lasts more than five seconds, and it is presented in parallel with other content.\n\n`autoplay` settles the first condition and `loop` settles the second, but nothing in `<video autoplay loop>` settles the third, and line 85 says so explicitly for the parallel case: \"a loader that fills the viewport with nothing beside it is not\". So a lens meeting a full-bleed autoplay looping hero video with nothing beside it gets two rules pointing opposite ways, and the later one is the one that matches WCAG. The mismatch is not cosmetic: line 74's whole apparatus is written about CSS animations — `animation-duration` times `animation-iteration-count`, `infinite`, why a `transition` is outside the bullet — and never returns to `<video>`, so the reader has no guidance on what settles \"in parallel\" for a media element and falls back on the flat rule at line 33.\n\nThe same two passages ship into every review through the generated copy at `agents/anthropic-accessibility-review.md`, so the fix belongs in the extras file, which is the root cause. Qualify line 33 to carry the third condition, along the lines of: \"`<video autoplay loop>` with no `controls`, where something else is presented alongside it (2.2.2, Level A). `autoplay` settles automatic start and `loop` settles the five-second threshold; the markup usually shows whether anything sits beside it.\" That also supplies the level, which line 33 omits and which the 2.3.3 bullet at line 88 asks a lens to state whenever it names a criterion.","category":"incorrect-guidance","status":"new","score":30,"tier":"medium","found_by":["anthropic-accessibility-review"],"risk":{"impact":"minor","data_exposure":"none","blast_radius":"all-users","reversibility":"reversible","detectability":"silent","availability":"none","contract":"standard","maintenance":"friction","likelihood":"possible","confidence":"confirmed","privileges_required":"none","attack_vector":"ordinary-use","timing":"live"},"unrated":[]},{"file":"README.md","line":164,"title":"\"7 files\" is a census on a line this diff rewrote, against the no-counts rule the same diff adds","body":"The rewritten bullet reads:\n\n```\n- `test/fixture-defects` against `test/fixture` is the realistic case. Its diff touches\n  7 files, and some findings root-cause into files the diff does not touch, ...\n```\n\n`CLAUDE.md` line 119, added in this diff, says: \"Do not write a count of what this repository holds ... The README led with 'fourteen lenses' for a full round after the set became thirteen, and nothing failed. Name the set instead of counting it.\" The fixture branch is something this repository holds, the count is falsifiable by the next commit to `test/fixture-defects`, and nothing checks it. The clause was reworded here without the count going with it.\n\nFix: name the set instead — \"Its diff touches a handful of files, and some findings root-cause into files the diff does not touch\" — or drop the quantity.","category":"convention-violation","status":"new","score":35,"tier":"medium","found_by":["caveman-review"],"risk":{"impact":"minor","data_exposure":"none","blast_radius":"none","reversibility":"not-applicable","detectability":"not-applicable","availability":"not-applicable","contract":"house-rule","maintenance":"compounding","likelihood":"not-applicable","confidence":"confirmed","privileges_required":"not-applicable","attack_vector":"not-applicable","timing":"not-applicable"},"unrated":[]},{"file":"review/caveats.ts","line":33,"end_line":41,"title":"The reopening sentences a reader is shown still name `MEMBER` after it was removed from `MAY_DECLINE`","body":"Commit `48f8bd1` (\"Take organisation membership out of what may dismiss a finding for good\") narrowed `MAY_DECLINE` in `review/findings.ts` to `new Set([\"OWNER\", \"COLLABORATOR\"])` and updated `orchestrator.md` and `review/DECISIONS.md` to match. Three statements of the same rule were left behind:\n\n```ts\nuntraceable: (n) =>\n    `${plural(n, \"decline\")} cited no comment from an owner, member or collaborator,` + ...\n\nunvouched: (n) =>\n    `${plural(n, \"finding\")} came back as already raised at a rating this review prints` +\n    \" in full, with no owner, member or collaborator having said so. Reporting them as new.\",\n```\n\nplus the comment on the `already-reported` branch at `review/findings.ts:403` (\"takes an owner, a member or a collaborator saying so\").\n\nThe first two are not comments; they are the sentences printed to whoever is watching their decline come back, by both `post-review.ts` and `print-findings.ts`. A maintainer whose organisation colleague wrote \"working as intended\" is told the decline \"cited no comment from an owner, member or collaborator\" when it cited exactly such a comment, and goes looking for a bug in the citation rather than learning that `MEMBER` is deliberately not enough. That is the reopening explanation contradicting the rule it is explaining.\n\nThe root cause is that the rule is written out in prose in four places and enforced in one — the docstring on `MAY_DECLINE` makes the point itself: \"Narrowed in one place only, the model would go on declining on a rule this overturns every run.\"\n\nFix: change all three sites to \"an owner or a collaborator\", and consider deriving the phrase from `MAY_DECLINE` (a small `entitledNames()`), or asserting it in a test, so the next narrowing cannot leave it behind.","category":"stale-message","status":"new","score":24,"tier":"low","found_by":["wshobson-code-review-excellence","cursor-thermo-nuclear-review"],"risk":{"impact":"moderate","data_exposure":"none","blast_radius":"single-user","reversibility":"reversible","detectability":"delayed","availability":"none","contract":"none","maintenance":"duplicated","likelihood":"possible","confidence":"confirmed","privileges_required":"user","attack_vector":"ordinary-use","timing":"live"},"unrated":[]},{"file":"review/markdown.ts","line":363,"end_line":365,"title":"Prose in a posted review may carry a link whose label and destination are both attacker-chosen","body":"`escapeTags` is what every block of model prose passes through — a finding's `body` via `bullet`, and `summary` and `notes` via `prose`:\n\n```ts\nfunction escapeTags(text: string): string {\n    const escape = escapeChars(\"\\\\<@#\");\n\n    return escapeOutsideCode(text, (prose) => escape(prose).replace(/!(?=\\[)/g, \"\\\\!\"));\n}\n```\n\n`[`, `]`, `(` and `)` are left alone, so `[Read the full report](https://example.invalid/x)` reaches the page as a live link with a label of the writer's choosing, inside a comment posted by the account holding `pull-requests: write`.\n\nThe docstring's justification answers a different question. It says \"bounding the links in it would buy nothing: GFM autolinks a bare `https://` run, so the same destination reaches the same page with no link syntax at all.\" That is about the destination being reachable. It is not about the label: an autolink shows the URL, and `[label](url)` hides it. `mention` in `review-body.ts` is bounded to the linkable set for exactly this reason, in its own words — \"`mention` puts a url from somewhere else behind a label of ours that reads as provenance, and a reader clicks it on the strength of that label\" — and prose gets a label the model chose with no bound at all. The two policies also disagree about the same characters: `escapeInline`, used for titles, categories and lens names, escapes `[` and `]` through `escapeChars(\"\\\\*_[]<~@#\")`.\n\nThe text is attacker-reachable. `fetch-existing.ts` writes every comment body into `existing.json`, and `review/orchestrator.md` instructs the orchestrator to relay attempted-injection text verbatim: \"Where someone has tried, put the line in `notes`: it is evidence about the pull request.\" On a public repository anyone able to comment can supply that line. What lands is a bot-authored comment carrying a link whose text says one thing and whose target says another, read both by a person deciding whether to stop and by the agent that works through the review.\n\nFix: add `]` (or `[` and `]`) to the set in `escapeTags`, so a link written in prose renders as its literal text with the URL visible and GFM autolinking whatever bare URL the model actually meant. If keeping model-authored links is wanted instead, render the destination beside the label rather than behind it, and put the target through `linkTarget` first.","category":"markdown-link-injection","status":"new","score":21,"tier":"low","found_by":["copilot-security-review"],"risk":{"impact":"moderate","data_exposure":"none","blast_radius":"all-users","reversibility":"reversible","detectability":"delayed","availability":"none","contract":"none","maintenance":"none","likelihood":"possible","confidence":"probable","privileges_required":"none","attack_vector":"network","timing":"live"},"unrated":[]},{"file":"review/review-body.ts","line":145,"title":"The `deferrable` half of `isPrinted` is derived twice, in two modules, from the same `Destination`","body":"`Destination` exists so one question gets one answer, and `isPrinted` is deliberately shared so \"the set it protects and the set a reader sees are one set\". But the second argument to that shared function is worked out independently on each side:\n\n- `review/review-body.ts:145` — `isPrinted(f, threshold, to.kind === \"artifact\")`\n- `review/post-review.ts:133` — `to.kind === \"artifact\"` passed as `deferrable` into `vetAgainstExisting`\n\nSharing the function while duplicating the predicate leaves exactly the drift the design was built to prevent. Add a fourth `Destination` variant that also keeps findings, or change which kinds defer, and one site is updated while the other is not — and the failure is silent in the dangerous direction: the body prints a finding in full while `vetSuppression` still treats it as one a closed thread may settle for the life of the pull request.\n\nThe fix is a single accessor beside the type, e.g. `export function defers(to: Destination): boolean { return to.kind === \"artifact\"; }`, called at both sites and at `review-body.ts:819`, which spells the same test a third time to reach for the url. Better still, since `threshold` and `deferrable` never travel apart, make it one value — see the separate finding on those two parameters — so there is nothing left for a caller to derive at all.","category":"duplicated-derivation","status":"new","score":24,"tier":"low","found_by":["cursor-thermo-nuclear-review"],"risk":{"impact":"moderate","data_exposure":"none","blast_radius":"all-users","reversibility":"reversible","detectability":"silent","availability":"none","contract":"none","maintenance":"duplicated","likelihood":"unlikely","confidence":"confirmed","privileges_required":"maintainer","attack_vector":"push-access","timing":"latent"},"unrated":[]},{"file":"review/review-body.ts","line":827,"end_line":841,"title":"The artifact sentence is copy-pasted, and hardcodes a name `review/artifact.ts` is generated to own","body":"`listingOf` writes the same clause twice, verbatim:\n\n```ts\n` \\`findings.json\\` in the \\`codeferret-run\\` artifact of [this run](${artifact}) holds every one.`\n```\n\nat line 827 and again at line 841. Two copies of one sentence in one function is the ordinary kind of duplication; the interesting part is what the sentence contains. `review/artifact.ts` exists precisely so the artifact name has one home — it is generated from `action.yml` by `scripts/build-defaults.ts`, and its own docstring says \"The name is protocol between the step that writes the artifact and the run that opens it.\" `fetch-previous.ts` imports `ARTIFACT_NAME` from it. `review-body.ts` does not: it types `codeferret-run` out by hand, twice, and `findings.json` by hand three times (827, 841, and 863's `Set \\`artifact-path\\` to \\`findings.json\\``).\n\nSo renaming the artifact in `action.yml` regenerates the constant, updates the code that reads the artifact, and leaves the posted review telling every reader to download an artifact by a name that no longer exists — with nothing red, because the generator check only compares the generated file against `action.yml`.\n\nExtract one helper, `function artifactSentence(url: string): string`, built from `ARTIFACT_NAME` and the findings-file name (`artifact-path.ts` already has `FINDINGS_FILE` as a private const — export it, or move both names beside `ARTIFACT_NAME`), and call it from both branches and from `omissionFor`.","category":"duplicated-code","status":"new","score":24,"tier":"low","found_by":["cursor-thermo-nuclear-review"],"risk":{"impact":"minor","data_exposure":"none","blast_radius":"all-users","reversibility":"reversible","detectability":"silent","availability":"none","contract":"none","maintenance":"duplicated","likelihood":"unlikely","confidence":"confirmed","privileges_required":"maintainer","attack_vector":"push-access","timing":"latent"},"unrated":[]},{"file":"review/scrub-credentials.sh","line":188,"title":"`scrub_urls` reports back to `scrub_repo` through an undeclared global rather than an exit status","body":"`scrub_repo` initialises `URL_SCRUBBED=0`, calls `scrub_urls`, and then reads the variable back to decide whether to run `purge_url_traces`. `scrub_urls` sets `URL_SCRUBBED=1` deep inside a `while` loop as a side effect, and the variable is declared nowhere — not `local` in either function, not documented in the header that lists everything else this script does.\n\nIn a script whose whole job is proving a credential is gone, an unnamed global is the wrong channel for \"a credential was found in a url\". It is invisible to a reader of either function, it is one `local` away from silently never propagating — which would leave the reflog purge unrun and credential traces in place — and `scrub-credentials.test.ts` cannot observe it directly.\n\nA shell function already has a return channel. Have `scrub_urls` end with a `return` reflecting whether anything was rewritten, and write the caller as:\n\n```sh\nif scrub_urls; then\n    purge_url_traces\nfi\n```\n\nThat deletes the global, keeps the reflog purge exactly as conditional as it is now, and makes the coupling between the two functions visible in the one line that couples them.","category":"implicit-global","status":"new","score":22,"tier":"low","found_by":["cursor-thermo-nuclear-review"],"risk":{"impact":"moderate","data_exposure":"credentials","blast_radius":"tenant","reversibility":"costly","detectability":"silent","availability":"none","contract":"none","maintenance":"friction","likelihood":"unlikely","confidence":"confirmed","privileges_required":"maintainer","attack_vector":"push-access","timing":"latent"},"unrated":[]},{"file":"review/lens-extras/vercel-next-best-practices.md","line":43,"end_line":48,"title":"The do-not-run list names `npm run build` but not `npm run dev`, `npm start` or `next start`","body":"The first bullet forbids `next dev` by name, and the last bullet exists because a package script hides the underlying command: \"None names `next` on the command line, but each starts a build or a server the same way the first two bullets rule out.\" It then lists `npm run build`, `pm2 start ecosystem.config.js`, `npx create-sst@latest` and `npx @opennextjs/aws build`.\n\nThe indirect form of `next dev` is missing from that reasoning. `npm run dev`, `pnpm dev`, `yarn dev` and `bun dev` are what `create-next-app` writes into `package.json` and are the commands a lens is most likely to reach for in a JavaScript checkout, and none of them names `next` on the command line, so the same argument that put `npm run build` in the list applies to them and they are not there. The consequence is the exact corruption the first bullet exists to prevent: a dev server writes `.next/` into the checkout every other lens in the run is reading, and `/codeferret:review` runs against a developer's own tree where that directory is often already populated with a different build.\n\n`next start` and `npm start` are missing too, and they fall through the first bullet's catch-all rather than being caught by it: that catch-all is scoped to \"any other command that writes into the checkout\", and `next start` serves an existing build without writing one. Only the blanket sentence at the head of the second bullet covers them, while the far less likely `node .next/standalone/server.js` is spelled out.\n\nFix: extend the last bullet to name `npm run dev` (and the `pnpm`/`yarn`/`bun` equivalents), `npm start` and `next start` alongside `npm run build`, with the same one-clause reason. Because `agents/vercel-next-best-practices.md` is generated from this file, edit the extras and re-run `bun scripts/build-lens-agents.ts` rather than editing the agent.","category":"missing-requirement","status":"new","score":23,"tier":"low","found_by":["vercel-next-best-practices"],"risk":{"impact":"moderate","data_exposure":"none","blast_radius":"single-user","reversibility":"costly","detectability":"delayed","availability":"none","contract":"none","maintenance":"none","likelihood":"possible","confidence":"confirmed","privileges_required":"none","attack_vector":"ordinary-use","timing":"live"},"unrated":[]},{"file":"CLAUDE.md","line":444,"end_line":447,"title":"The accepted-risk register enumerates what leaves the runner as \"nothing else\" and omits `session-changed.txt`","body":"The \"A lens can read `CLAUDE_CODE_OAUTH_TOKEN`\" entry says of this repository's own `artifact-path`:\n\n> It now names two classes and nothing else: the review's own output (`findings.json`, `run.json` and `lens-list.txt`) and this run's numbers (`cost-usd`, `duration-ms`, `permission-denials` and `findings-checked`).\n\nThat is seven names. `.github/workflows/codeferret.yml` names eight: `session-changed.txt` sits between `lens-list.txt` and `cost-usd`, and the workflow's own comment gives it a paragraph explaining why it is there (\"the one file below that says whether any of the rest may be the session's own answer\"). So the register's closed enumeration of what a public repository publishes for 14 days is wrong about its own subject, in the one document meant to be the record of what was weighed. The entry also files `findings-checked` under \"this run's numbers\", where the workflow correctly says it is a marker written from `check-findings.ts`'s exit code rather than a measurement.\n\nThis is the failure mode the register's neighbouring bullet names: a written-down enumeration of what the repository holds that nothing mechanical reconciles against the file it describes.\n\nFix: add `session-changed.txt` to the list, and either move `findings-checked` out of \"this run's numbers\" or reword that clause so it covers a marker as well as a measurement. Longer term this pair is a candidate for the same treatment `artifact.ts` got — generated from `.github/workflows/codeferret.yml` rather than restated — since `checkRunFiles` already shows the shape of a check that reads that file.","category":"stale-doc","status":"new","score":24,"tier":"low","found_by":["anthropic-code-review"],"risk":{"impact":"minor","data_exposure":"none","blast_radius":"none","reversibility":"not-applicable","detectability":"not-applicable","availability":"not-applicable","contract":"house-rule","maintenance":"duplicated","likelihood":"not-applicable","confidence":"confirmed","privileges_required":"not-applicable","attack_vector":"not-applicable","timing":"not-applicable"},"unrated":[]},{"file":"review/existing.ts","line":105,"end_line":116,"title":"`Survey` carries a twelve-line doc comment for the `linkable` field the last commit deleted","body":"The head commit (`369738d`, \"Derive the linkable urls from the comments rather than holding them twice\") removed `linkable: Set<string>` from `Survey`, from `survey()`'s local state and from its return value, and left the JSDoc block that documented it. What remains is a comment attached to nothing, sitting in the trailing-doc position between `comments` and the closing brace:\n\n```ts\nexport interface Survey {\n    /** Every comment the pull request carries, by url. */\n    comments: Map<string, Located>;\n    /**\n     * Every url the pull request carries, which is what a review body may render as a link.\n     * ...\n     * Widening it means giving a thread a url of its own in the fetch, and a reason to.\n     */\n}\n```\n\nIt compiles and nothing fails, which is why `tsc` and the checks pass over it. What it costs is a reader of `Survey`: told about a second member (\"Named apart from them\", \"Widening it means...\") that is not there, and — since the paragraph argues about `mention`'s bound and how one would widen it — sent looking for the declaration that argument attaches to. The next reader is as likely to take it for documentation of `comments`, whose contract is different. In a codebase where the comments are half the lines and are the primary record of why anything is the way it is, an orphan costs more than usual. This is also precisely the class of defect `review/lens-extras/comment-review.md` in this same diff tells a lens to report, and `comment-review` is switched off in this repository's own workflow, so nothing caught it.\n\nOne lens went further on the structural half: `Survey` is now a wrapper around one map, `survey()` returns `{ comments }`, and every caller immediately unwraps it (`discussion.comments`, `vetted.survey.comments.keys()`).\n\nFix: delete the orphaned block, folding whatever of it still holds — that the linkable set is exactly the keys of `comments`, which is what `post-review.ts` now passes, and what widening it would take — into the `comments` doc comment or a docstring above `export interface Survey`. If the interface is not about to gain a second view, consider having `survey()` return the map directly and dropping the wrapper.","category":"dead-documentation","status":"new","score":11,"tier":"low","found_by":["caveman-review","anthropic-code-review","wshobson-code-review-excellence","cursor-thermo-nuclear-review"],"risk":{"impact":"none","data_exposure":"none","blast_radius":"none","reversibility":"not-applicable","detectability":"not-applicable","availability":"not-applicable","contract":"house-rule","maintenance":"friction","likelihood":"not-applicable","confidence":"confirmed","privileges_required":"not-applicable","attack_vector":"not-applicable","timing":"not-applicable"},"unrated":[]},{"file":"review/run-log.ts","line":182,"end_line":189,"title":"The same three-line comment sits above two statements, and is untrue of the first","body":"`runNumbers` carries the same comment twice, word for word:\n\n```ts\n// Narrowed element by element, not just as a container. This list is read by the report at\n// the end of a run, after the findings file is on disk, and a null or a string in it would\n// turn a complete run into a stack trace over the one report saying what a lens was refused.\nconst refused = Array.isArray(last.permission_denials) ? last.permission_denials : null;\n\n// Narrowed element by element, not just as a container. ...\nconst denials = (refused ?? []).map(record).filter((entry) => entry !== null);\n```\n\nThe second copy is true: `.map(record).filter(...)` is the element-by-element narrowing. The first is false about the line it sits on — `Array.isArray(...)` narrows only the container, which is precisely what the sentence says it is *not* doing. `refused` is deliberately left as the raw list, and the comment on `refusals` twelve lines further down explains why (\"The whole list, not the entries this file could read\"), so the wrong comment also contradicts the right one. A reader auditing whether the list is element-narrowed gets a yes from the wrong statement.\n\nFix: delete the first copy, or replace it with what that line is actually for — the container test, kept unfiltered so `refusals` counts every refusal including the ones this file cannot read.","category":"incorrect-comment","status":"new","score":11,"tier":"low","found_by":["caveman-review","wshobson-code-review-excellence"],"risk":{"impact":"none","data_exposure":"none","blast_radius":"none","reversibility":"not-applicable","detectability":"not-applicable","availability":"not-applicable","contract":"none","maintenance":"friction","likelihood":"not-applicable","confidence":"confirmed","privileges_required":"not-applicable","attack_vector":"not-applicable","timing":"not-applicable"},"unrated":[]},{"file":"review/README.md","line":264,"title":"The Files table omits `scrub-credentials.sh`, the one review script that is a security control","body":"The `## Files` table lists every other file under `review/` — checked mechanically, `README.md` and `scrub-credentials.sh` are the only two missing, and one of those is the table itself. `refuse-fork.sh`, its sibling in class and in the \"a script rather than a `run:` block\" argument, is the row directly above.\n\nA 364-line script that decides whether a live GitHub credential is still reachable by a lens is not the one to leave off the map. It is invoked from a step of its own in `action.yml`, `CLAUDE.md` leans on it in two separate bullets (\"Keeping the token out of the environment kept it in the checkout\" and \"Prove a credential is gone by looking for a credential\"), and its sibling `scrub-credentials.test.ts` is likewise unnamed while `refuse-fork.test.ts` is called out. It appears nowhere in `review/README.md` or `review/DECISIONS.md`.\n\nNothing catches the omission: `checkWorkflows`, `checkRunFiles` and the rest never read this table, so it is maintained entirely by hand.\n\nFix: add a row beside the `refuse-fork.sh` one, e.g. `` | `scrub-credentials.sh` | Takes the checkout's credential back out of the workspace before a lens can read it, and reads back to prove it is gone. `scrub-credentials.test.ts` beside it. | ``","category":"incomplete-doc","status":"new","score":11,"tier":"low","found_by":["caveman-review","anthropic-code-review"],"risk":{"impact":"minor","data_exposure":"none","blast_radius":"none","reversibility":"not-applicable","detectability":"not-applicable","availability":"not-applicable","contract":"none","maintenance":"friction","likelihood":"not-applicable","confidence":"confirmed","privileges_required":"not-applicable","attack_vector":"not-applicable","timing":"not-applicable"},"unrated":[]},{"file":"review/findings.ts","line":353,"end_line":360,"title":"`threshold` and `deferrable` are threaded as two positional parameters through three layers","body":"The pair travels together everywhere and means one thing — what this run prints in full — but is passed as two loose positional arguments through the whole stack:\n\n- `vetSuppression(findings, discussion, raisedFiles, threshold, deferrable)` (5 positional params)\n- `vetAgainstExisting(findings, buildDir, report, threshold, deferrable)` (5 positional params)\n- `isPrinted(f, threshold, deferrable)`\n\n`caveats.ts` already writes down why this repository dislikes that shape, in the docstring on `Coverage`: \"A bag rather than a parameter list ... swapping the two adjacent arguments still compiled.\" The same argument applies here with an extra edge: because the two are separate, each caller has to derive `deferrable` for itself, which is the duplication reported separately against `to.kind === \"artifact\"`.\n\nOne small type carried end to end:\n\n```ts\nexport interface PrintBar { threshold: Tier; deferrable: boolean }\n```\n\nBuilt once in `post-review.ts` from the `Destination` and the input, handed to `vetAgainstExisting` and to `composeReview`, and read by `isPrinted(f, bar)`. Three signatures shrink, two derivations of `deferrable` collapse into the one place the bar is built, and `Posting` in `review-body.ts` embeds the same value instead of carrying `to` and `threshold` as separate fields a reader has to recombine.","category":"parameter-threading","status":"new","score":11,"tier":"low","found_by":["cursor-thermo-nuclear-review"],"risk":{"impact":"none","data_exposure":"none","blast_radius":"none","reversibility":"not-applicable","detectability":"not-applicable","availability":"not-applicable","contract":"house-rule","maintenance":"friction","likelihood":"not-applicable","confidence":"confirmed","privileges_required":"not-applicable","attack_vector":"not-applicable","timing":"not-applicable"},"unrated":[]},{"file":"review/findings.ts","line":372,"end_line":449,"title":"`vetSuppression` holds two independent suppression policies inside one `map` closure","body":"The mapper in `vetSuppression` runs to roughly eighty lines, of which about sixty are comment, and it contains two policies that share nothing but the `reopen` helper and the `cited` lookup: the `declined` branch (entitlement, or a closed thread below the print bar, then relatedness) and the `already-reported` branch (print bar, then either a cited comment or `raisedBefore`). Each branch has its own multi-paragraph argument inlined at the point of decision, so reading either one means scrolling past the other, and neither can be exercised on its own.\n\nThe structure the file already reaches for elsewhere is available here: two pure functions returning the reason to reopen, or null.\n\n```ts\nfunction vetDecline(f: Finding, cited: Located | undefined, bar: PrintBar): Reopening | null\nfunction vetReported(f: Finding, cited: Located | undefined, raisedFiles: ReadonlySet<string>, bar: PrintBar): Reopening | null\n```\n\n`vetSuppression` then becomes a dispatcher over `f.status` with one increment site, which is the property its own comment says the current shape exists to guarantee — and that property survives the split, because the counter still lives in the caller. Each policy gets a docstring of its own instead of a running commentary interleaved with `if`s, and a test can name one branch. Behaviour is unchanged.","category":"decomposition","status":"new","score":19,"tier":"low","found_by":["cursor-thermo-nuclear-review"],"risk":{"impact":"none","data_exposure":"none","blast_radius":"none","reversibility":"not-applicable","detectability":"not-applicable","availability":"not-applicable","contract":"none","maintenance":"untested","likelihood":"not-applicable","confidence":"confirmed","privileges_required":"not-applicable","attack_vector":"not-applicable","timing":"not-applicable"},"unrated":[]},{"file":"review/review-body.ts","line":312,"end_line":482,"title":"`review-body.ts` mixes what the review says with the generic machinery for fitting it in a length budget","body":"At 878 lines this file is the largest in the repository and is approaching the point where it stops being scannable; its test file, `review/review-body.test.ts`, is already 1002 lines, most of it cases for one half of the module.\n\nThere is a clean seam. One half is what a review body says: `composeReview`, `headOf`, `tailOf`, `listingOf`, `bullet`, `mention`, `where`, `omissionFor`, `POSTING_NOTICES`. The other half is a general \"fit a list of rendered items into a character budget and say what was left out\" library with no knowledge of findings at all: `MAX_BODY`, `OMISSION_RESERVE`, `cutToFit`, `boundedList`, `boundedBlock`, `assemble`, `fit`, `dropEmptyDetails`, `outranksPrinted`. The second half is already the part exported \"for review-body.test.ts\" rather than for a caller, which is usually the sign that it wants to be its own module.\n\nMoving it to `review/body-budget.ts` leaves `review-body.ts` around 500 lines about the review, gives the budget rules a test file of their own under 1000 lines, and makes the one genuinely subtle rule here — that dropping is per item rather than at the tail, and that `outranksPrinted` is what makes the page honest about it — readable without the finding-rendering code around it. Only `outranksPrinted` needs a finding at all, and it only needs `findingRank`, which can be passed in.","category":"file-size","status":"new","score":11,"tier":"low","found_by":["cursor-thermo-nuclear-review"],"risk":{"impact":"none","data_exposure":"none","blast_radius":"none","reversibility":"not-applicable","detectability":"not-applicable","availability":"not-applicable","contract":"none","maintenance":"friction","likelihood":"not-applicable","confidence":"confirmed","privileges_required":"not-applicable","attack_vector":"not-applicable","timing":"not-applicable"},"unrated":[]},{"file":"review/caveats.ts","line":246,"end_line":268,"title":"Two notices repeat the clamp-escape-marker dance and re-spell the cut marker `markdown.ts` owns","body":"`COVERAGE_NOTICES.unread` and `COVERAGE_NOTICES.unrated` each do the same four steps by hand:\n\n```ts\nconst { kept, marker } = clampTo(text, LIMIT);\n// ...\n`${escape(kept)}${marker === \"\" ? \"\" : \" (cut for length)\"}`\n```\n\nBoth discard the `marker` `clampTo` returns and write their own literal in its place, so the phrase \"(cut for length)\" is now spelled in `markdown.ts` (`CUT_MARKER`), in `review-body.ts` (`bullet`'s `\" (cut for length)\"`), and twice here — four copies of one piece of user-facing wording, with `Clamped.marker`'s documented contract (\"Markdown of its own, so a caller must not escape it\") quietly ignored at three of them.\n\nOne helper beside `clampTo`, e.g. `export function clampedInline(text: string, limit: number, escape: Escape): string`, that clamps, escapes the kept text and appends the inline form of the marker, would give the two notices one line each and put the wording in one place. `MAX_UNREAD` and `MAX_UNRATED` are also both `500` with near-identical docstrings; if the reason is the same reason, say it once and use one constant.","category":"duplicated-code","status":"new","score":24,"tier":"low","found_by":["cursor-thermo-nuclear-review"],"risk":{"impact":"minor","data_exposure":"none","blast_radius":"none","reversibility":"not-applicable","detectability":"not-applicable","availability":"not-applicable","contract":"house-rule","maintenance":"duplicated","likelihood":"not-applicable","confidence":"confirmed","privileges_required":"not-applicable","attack_vector":"not-applicable","timing":"not-applicable"},"unrated":[]},{"file":"scripts/checks/bun-config.ts","line":1,"end_line":57,"title":"A 57-line design argument, including a weighed-and-refused alternative, sits in a check module rather than in DECISIONS.md","body":"The module docstring here is 57 lines in front of a 100-line body, and it is doing two different jobs. Some of it explains the regexes below it, which is right where it is. The rest is a decision record: why `--config=/dev/null` matters at all (already `## Bun runs whatever a \\`bunfig.toml\\` in the reviewed tree names` in `review/DECISIONS.md`), and a full paragraph weighing and refusing an alternative design — the `cf_bun` wrapper — that this file does not implement and never will.\n\nThis repository has a stated rule about that. `CLAUDE.md` says \"Each of these is a rule and the one fact that makes it stick. The argument behind each one is in `review/DECISIONS.md`\", and there is a commit in this very range titled \"Keep each argument in one place and point the code sites at it.\" The `cf_bun` argument is an argument, it has no home in `DECISIONS.md`, and nobody looking for \"why is the flag rule shaped this way\" will find it inside a check module.\n\nMove the flag rationale and the refused-alternative paragraph under the existing `DECISIONS.md` heading, and leave here the part a reader of the regex needs: what the pair matches, why the second half is a path rather than `.ts`, and why an empty match is a failure. Roughly the same trade is worth making in `review/review-body.ts` and `review/findings.ts`, where about half of every file is prose — this diff already shows what that costs, in the stale statements of the decline rule reported separately.","category":"wrong-layer","status":"new","score":11,"tier":"low","found_by":["cursor-thermo-nuclear-review"],"risk":{"impact":"none","data_exposure":"none","blast_radius":"none","reversibility":"not-applicable","detectability":"not-applicable","availability":"not-applicable","contract":"house-rule","maintenance":"friction","likelihood":"not-applicable","confidence":"confirmed","privileges_required":"not-applicable","attack_vector":"not-applicable","timing":"not-applicable"},"unrated":[]},{"file":"review/summary.ts","line":82,"title":"`refused` renders the string \"null tool calls were\" whenever the denial count is unknown","body":"`denials` is `number | null`, and null is the deliberate answer for a log carrying no `permission_denials` list at all — the comment above it says so, and says collapsing it to 0 is exactly what must not happen. But the sentence is built unconditionally:\n\n```ts\nconst refused = denials === 1 ? \"1 tool call was\" : `${denials} tool calls were`;\n```\n\nWith `denials === null` this evaluates to `\"null tool calls were\"`. Today it is unused on that path, because the ternary below it routes null to its own warning before `refused` is read. So this is not a live defect — it is a string that is only correct because of a branch written elsewhere, sitting in a module that has no test file of its own.\n\nThe same module's own docstrings record that this class of thing has already shipped once here (\"Cost rendered as a bare `$`, Findings as a blank cell, and `count` turned `Number(\"\")` into a 0 that reads as a measurement\").\n\nFix: build the sentence inside the branch that knows `denials` is a number, e.g. move it into the `denials > 0` arm of the `refusals` ternary, so the null case cannot reach it at all.","category":"latent-bug","status":"new","score":19,"tier":"low","found_by":["wshobson-code-review-excellence"],"risk":{"impact":"minor","data_exposure":"none","blast_radius":"single-user","reversibility":"reversible","detectability":"obvious","availability":"none","contract":"none","maintenance":"untested","likelihood":"theoretical","confidence":"confirmed","privileges_required":"not-applicable","attack_vector":"not-applicable","timing":"latent"},"unrated":[]},{"file":"review/caveats.ts","line":238,"end_line":330,"title":"`COVERAGE_NOTICES` declares `unrated` before `changed`, while `COVERAGE_ORDER` renders them the other way round","body":"`COVERAGE_ORDER` is `[\"unread\", \"changed\", \"unrated\", \"unaccounted\", \"silent\", \"broken\", \"limited\"]`, and `raisedIn` filters in that order, so that is what a reader of the review meets. The `COVERAGE_NOTICES` record below it declares them `unread`, `unrated`, `changed`, ... — the middle two swapped.\n\nNothing renders wrongly, because the tuple is what orders the output. What it costs is a reader: each entry in the record carries a comment written as positional commentary (`unread`: \"First, because ...\"; `unrated`: \"Beside the counts rather than among the lens notices\"; `changed`: \"Above the coverage notices, because it is what decides how much they are worth\"), so the block reads as if declaration order were the rendered order, and it is not. The sibling `REOPENING` table one section above makes the opposite promise explicitly (\"Declared in the order a reader meets these reasons, which `REOPENING_ORDER` below reads off this object\"), which sets the expectation this record then breaks.\n\nFix: move the `changed` entry above `unrated` so the record reads in `COVERAGE_ORDER`'s order, or add a line to the `COVERAGE_NOTICES` docstring saying that the order lives in the tuple above and this record is keyed rather than ordered.","category":"readability","status":"new","score":11,"tier":"low","found_by":["anthropic-code-review"],"risk":{"impact":"none","data_exposure":"none","blast_radius":"none","reversibility":"not-applicable","detectability":"not-applicable","availability":"not-applicable","contract":"none","maintenance":"friction","likelihood":"not-applicable","confidence":"confirmed","privileges_required":"not-applicable","attack_vector":"not-applicable","timing":"not-applicable"},"unrated":[]},{"file":"review/review-body.ts","line":569,"title":"Three code comments cite DECISIONS.md without naming a heading, against the rule review/README.md states","body":"`review/README.md` line 214 and lines 269-270 state the rule: \"A code comment that cites one names its heading, so `\\\"The reviewed tree does not configure the session\\\" in review/DECISIONS.md` is a heading you can search for.\"\n\nThree citations do not:\n\n- `review/review-bod
