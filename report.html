y.ts:569` — \"which needs a signal for that and is written up in review/DECISIONS.md\". The write-up is at DECISIONS.md:500, under `## \\`lens_health\\` covers every lens dispatched`.\n- `review/print-findings.ts:13` — \"for the reason `review/DECISIONS.md` gives\".\n- `review/risk.ts:6` — \"review/DECISIONS.md refused to filter on it for exactly that reason\".\n\nEach sends a reader to a 689-line file with no anchor, which is the cost the rule exists to avoid.\n\nFix: name the heading in each, as `action.yml`, `lib.sh`, `run.sh`, `build-prompts.sh` and `fetch-previous.ts` already do.","category":"convention-violation","status":"new","score":11,"tier":"low","found_by":["caveman-review"],"risk":{"impact":"none","data_exposure":"none","blast_radius":"none","reversibility":"not-applicable","detectability":"not-applicable","availability":"not-applicable","contract":"house-rule","maintenance":"friction","likelihood":"not-applicable","confidence":"confirmed","privileges_required":"not-applicable","attack_vector":"not-applicable","timing":"not-applicable"},"unrated":[]},{"file":"review/refuse-fork.sh","line":84,"end_line":103,"title":"`named` is both the loop variable at line 84 and the accumulator at line 103","body":"```sh\nfor named in \"$HEAD_REPO\" \"$RUN_REPO\"; do\n...\nnamed=\"\"\n\nname_route() { if [ -z \"$named\" ]; then named=$1; else named=\"$named, $1\"; fi }\n```\n\nIt is correct only because line 99 exits when either payload field is set, so the loop variable's leftover value is always empty by the time line 103 reassigns it — and line 103 reassigns it anyway. Two facts a reader has to hold at once to see that the accumulator is not seeded with a repository name, in the script that decides whether a fork's pull request is refused.\n\nFix: rename the loop variable, e.g. `for repo in \"$HEAD_REPO\" \"$RUN_REPO\"`, and leave `named` to the accumulator.","category":"readability","status":"new","score":11,"tier":"low","found_by":["caveman-review"],"risk":{"impact":"minor","data_exposure":"none","blast_radius":"none","reversibility":"not-applicable","detectability":"not-applicable","availability":"not-applicable","contract":"none","maintenance":"friction","likelihood":"unlikely","confidence":"confirmed","privileges_required":"maintainer","attack_vector":"push-access","timing":"latent"},"unrated":[]},{"file":"review/lens-extras/copilot-web-design-reviewer.md","line":79,"title":"The corrections file says visual-checklist.md ends with the priority matrix, and it does not","body":"Line 79 reads \"`references/visual-checklist.md` ends with a P0 to P3 one\". The P0 to P3 matrix is under `## Priority Matrix`, and a further section, `## Verification Tools`, follows it, so the file does not end there. The matrix exists and the surrounding instruction is sound, but \"ends with\" is a locating instruction, and an agent that reads the tail of the file to find the scale lands on a list of browser devtools instead.\n\nFix: change \"ends with a P0 to P3 one\" to \"carries a P0 to P3 one under `## Priority Matrix`\". `scripts/checks/lens-corrections.ts` already binds the fragment `## Priority Matrix` for this extras file, so the corrected wording is the one the check is anchored to.","category":"inaccurate-reference","status":"new","score":11,"tier":"low","found_by":["copilot-web-design-reviewer"],"risk":{"impact":"minor","data_exposure":"none","blast_radius":"none","reversibility":"not-applicable","detectability":"not-applicable","availability":"not-applicable","contract":"none","maintenance":"friction","likelihood":"not-applicable","confidence":"confirmed","privileges_required":"not-applicable","attack_vector":"not-applicable","timing":"not-applicable"},"unrated":[]},{"file":"review/versions.sh","line":18,"title":"The session-isolation boundary is measured on Claude Code 2.1.220, but the action installs 2.1.224","body":"`review/versions.sh` pins `export CLAUDE_CODE_VERSION=2.1.224`, and `action.yml`'s toolchain step installs exactly that. Every measurement the reviewed-tree isolation argument rests on was taken against a different build: `review/DECISIONS.md` (\"The reviewed tree does not configure the session\"), `CLAUDE.md`, `review/build-prompts.sh` and `scripts/checks/skills.ts` all say \"measured on 2.1.220\", and no file in the diff records a re-measurement on 2.1.224.\n\nWhat that boundary carries is not small. `review/run.sh` starts the orchestrator with `cd \"$WORKSPACE\"` — inside the branch under review — under `--permission-mode bypassPermissions` with `Bash`, in the step holding `CLAUDE_CODE_OAUTH_TOKEN`, and the flag `--setting-sources user` is the whole of what stops that branch's own `CLAUDE.md` being loaded as instruction and a `SessionStart` hook in its `.claude/settings.json` being executed. DECISIONS.md states both of those as facts established by dispatch against 2.1.220. If the flag's scope over project memory or project settings moved between the two builds, the reviewed branch supplies instructions (or a shell command) to a token-holding agent, and nothing in the run would report it: there is no assertion anywhere that the memory file was not read, and `permission-denials` stays at zero under `bypassPermissions` by construction.\n\nThe same version skew applies to two narrower claims: `scripts/build-lens-agents.ts` states that naming `Bash` in a lens's `tools` list withholds `Grep` and `Glob` \"on 2.1.220\", and `scripts/prepare-skill.ts` / `scripts/checks/skills.ts` state that `user-invocable: false` only hides a slash-menu entry \"on 2.1.220\". The tool list is the boundary that keeps `Write`, `Edit` and `Agent` away from a lens, so it is worth the same treatment.\n\nThis is a verification gap rather than a demonstrated exploit — 2.1.224 could not be run here to test it, and the behaviour may well be unchanged. The fix is to re-run the dispatch that produced the original measurement against the pinned version and update the version named in `review/DECISIONS.md`, `CLAUDE.md`, `review/build-prompts.sh`, `scripts/build-lens-agents.ts`, `scripts/prepare-skill.ts`, `scripts/checks/skills.ts` and `review/README.md`. Better still, bind the two mechanically the way `scripts/checks/toolchain.ts` already binds the two bun installs: a check that fails when the version named beside a measurement is not the `CLAUDE_CODE_VERSION` currently pinned turns a silent skew into a red lint. That is the shape `CLAUDE.md`'s accepted-risk register asks for — an acceptance with a lapse condition — and this measurement has one that nothing enforces.","category":"unverified-mitigation","status":"new","score":9,"tier":"nit","found_by":["sentry-security-review"],"risk":{"impact":"serious","data_exposure":"credentials","blast_radius":"tenant","reversibility":"costly","detectability":"silent","availability":"none","contract":"none","maintenance":"compounding","likelihood":"unlikely","confidence":"speculative","privileges_required":"user","attack_vector":"ci","timing":"latent"},"unrated":[]}]}</script>
<script>
(function () {
    "use strict";
    var D = JSON.parse(document.getElementById("data").textContent);
    var ORDER = { critical: 0, high: 1, medium: 2, low: 3, nit: 4 };
    var KEY = "codeferret-369738d-done";
    var done = {};
    try { done = JSON.parse(localStorage.getItem(KEY) || "{}") || {}; } catch (e) { done = {}; }
    function save() { try { localStorage.setItem(KEY, JSON.stringify(done)); } catch (e) { /* private window */ } }
    function esc(s) { return String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;"); }

    // The bodies are model-written markdown: fences, inline code, bold, lists.
    function blocks(src) {
        var lines = String(src).replace(/\r\n?/g, "\n").split("\n"), out = [], current = [], fenced = false;
        function flush() { if (current.length) { out.push(current); current = []; } }
        lines.forEach(function (line) {
            if (fenced) {
                current.push(line);
                if (/^```[ \t]*$/.test(line)) { fenced = false; flush(); }
            } else if (/^```/.test(line)) {
                flush(); fenced = true; current.push(line);
            } else if (/^\s*$/.test(line)) {
                flush();
            } else {
                current.push(line);
            }
        });
        flush();
        return out;
    }
    function md(src) {
        return blocks(src).map(function (lines) {
            var fence = lines.length > 1 && /^```[^\n]*$/.test(lines[0]) && /^```[ \t]*$/.test(lines[lines.length - 1]);
            if (fence) return "<pre><code>" + esc(lines.slice(1, -1).join("\n")) + "</code></pre>";
            if (lines.length && lines.every(function (l) { return /^\s*[-*]\s+/.test(l); })) {
                return "<ul>" + lines.map(function (l) { return "<li>" + inline(l.replace(/^\s*[-*]\s+/, "")) + "</li>"; }).join("") + "</ul>";
            }
            if (lines.length && lines.every(function (l) { return /^\s*\d+[.)]\s+/.test(l); })) {
                return "<ol>" + lines.map(function (l) { return "<li>" + inline(l.replace(/^\s*\d+[.)]\s+/, "")) + "</li>"; }).join("") + "</ol>";
            }
            return "<p>" + inline(lines.join(" ")) + "</p>";
        }).join("");
    }
    function inline(s) {
        var out = "", rest = String(s), m;
        while ((m = rest.match(/`([^`]+)`/))) {
            out += emph(esc(rest.slice(0, m.index))) + "<code>" + esc(m[1]) + "</code>";
            rest = rest.slice(m.index + m[0].length);
        }
        return out + emph(esc(rest));
    }
    function emph(s) { return s.replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>"); }

    var findings = D.findings.slice().sort(function (a, b) { return b.score - a.score; });
    findings.forEach(function (f, i) {
        f.id = f.file + "#" + (f.line || 0) + "#" + i;
        f.headingId = "finding-title-" + i;
    });

    document.getElementById("dek").textContent = D.summary;
    document.getElementById("f-total").textContent = findings.length;
    document.getElementById("f-cost").textContent = D.run.cost.toFixed(2);
    document.getElementById("f-dur").textContent = D.run.durationMin;
    document.getElementById("f-den").textContent = D.run.denials;
    document.getElementById("f-unrated").textContent = findings.filter(function (f) { return f.unrated.length > 0; }).length;
    document.getElementById("f-lens").textContent = D.lens_health.filter(function (l) { return l.ok; }).length + " / " + D.lens_health.length;

    var tally = {};
    findings.forEach(function (f) { tally[f.tier] = (tally[f.tier] || 0) + 1; });
    document.getElementById("ledger").innerHTML = Object.keys(ORDER).filter(function (t) { return tally[t]; })
        .map(function (t) { return '<div class="tally ' + t + '"><b>' + tally[t] + "</b><span>" + t + "</span></div>"; }).join("");

    document.getElementById("notes").innerHTML = md(D.notes);
    document.getElementById("lenses").innerHTML = D.lens_health.map(function (l) {
        return '<div class="lcell"><p class="nm"><span class="dot"></span>' + esc(l.lens) +
            ' <span style="font-weight:400;color:var(--muted)">' + l.returned + "</span></p>" +
            (l.detail ? '<p class="dt">' + esc(l.detail) + "</p>" : "") + "</div>";
    }).join("");

    // What each answer was worth, so a reader can see which axes carried the score and which
    // said nothing. `not-applicable` is inert by construction, so it gets no bar rather than
    // an empty one that would read as the mildest answer.
    function levelOf(axis, value) {
        var levels = (D.axes[axis] || { levels: [] }).levels;
        for (var i = 0; i < levels.length; i += 1) if (levels[i].v === value) return levels[i];
        return null;
    }
    function ratingOf(f) {
        var cells = Object.keys(D.axes).map(function (axis, axisIndex) {
            var value = f.risk[axis];
            var level = value === undefined ? null : levelOf(axis, value);
            var na = value === undefined || value === "not-applicable" || level === null;
            var pct = level && !na ? Math.round(level.s * 100) : 0;
            var shown = value === undefined ? "(unanswered)" : value;
            var questionId = f.headingId + "-axis-" + axisIndex;

            return '<div class="axis' + (na ? " na" : "") + '" aria-describedby="' + esc(questionId) + '">' +
                '<p class="n"><span>' + esc(axis.replace(/_/g, " ")) + "</span><em>" + esc(D.axes[axis].kind) + "</em></p>" +
                '<p class="q" id="' + esc(questionId) + '">' + esc(D.axes[axis].question) + "</p>" +
                '<p class="v">' + esc(shown) + "</p>" +
                '<div class="track"><i style="width:' + pct + '%"></i></div></div>';
        }).join("");

        return '<details class="rating"><summary>How it was rated</summary><div class="axes">' + cells + "</div></details>";
    }

    function card(f) {
        var loc = f.line ? f.file + ":" + f.line + (f.end_line && f.end_line !== f.line ? "-" + f.end_line : "") : f.file;
        var lenses = f.found_by.map(function (l) {
            return '<span class="lens' + (f.found_by.length > 1 ? " multi" : "") + '">' + esc(l) + "</span>";
        }).join("");

        return '<article class="finding t-' + esc(f.tier) + (done[f.id] ? " done" : "") + '">' +
            '<div class="stripe"></div><div class="inner">' +
            '<div class="frow"><h3 id="' + esc(f.headingId) + '">' + esc(f.title) + "</h3>" +
            '<input class="tick" type="checkbox" data-id="' + esc(f.id) + '"' + (done[f.id] ? " checked" : "") + ' aria-labelledby="' + esc(f.headingId) + '" aria-label="Mark handled"></div>' +
            '<div class="meta"><span class="score">' + f.score + " " + esc(f.tier) + "</span>" +
            '<span class="tag">' + esc(f.category || "uncategorised") + "</span>" +
            '<span class="tag">' + esc(f.status) + "</span>" +
            '<span class="loc">' + esc(loc) + "</span>" + lenses + "</div>" +
            '<div class="body">' + md(f.body) + "</div>" + ratingOf(f) + "</div></article>";
    }

    var tierOn = {}, hideDone = false, query = "", openAll = false;
    var list = document.getElementById("list"), empty = document.getElementById("empty");

    function matches(f) {
        var any = Object.keys(tierOn).some(function (k) { return tierOn[k]; });
        if (any && !tierOn[f.tier]) return false;
        if (hideDone && done[f.id]) return false;
        if (!query) return true;
        var hay = (f.file + " " + f.title + " " + f.category + " " + f.status + " " +
            f.found_by.join(" ") + " " + f.body + " " + Object.values(f.risk).join(" ")).toLowerCase();
        return hay.indexOf(query) !== -1;
    }

    function render() {
        var shown = findings.filter(matches);
        list.innerHTML = shown.map(card).join("");
        if (openAll) Array.prototype.forEach.call(list.querySelectorAll("details.rating"), function (d) { d.open = true; });
        empty.hidden = shown.length !== 0;
        document.getElementById("count").textContent = shown.length + " of " + findings.length;
    }

    list.addEventListener("change", function (e) {
        var t = e.target;
        if (!t.classList.contains("tick")) return;
        done[t.dataset.id] = t.checked;
        if (!t.checked) delete done[t.dataset.id];
        save();
        var art = t.closest(".finding");
        if (art) art.classList.toggle("done", t.checked);
        if (hideDone) {
            render();
            var next = Array.prototype.find.call(list.querySelectorAll(".tick"), function (box) { return box.dataset.id === t.dataset.id; });
            (next || document.getElementById("hide-done")).focus();
        }
    });

    Array.prototype.forEach.call(document.querySelectorAll(".chip[data-tier]"), function (btn) {
        btn.addEventListener("click", function () {
            var t = btn.dataset.tier;
            tierOn[t] = !tierOn[t];
            btn.setAttribute("aria-pressed", String(!!tierOn[t]));
            render();
        });
    });
    var hd = document.getElementById("hide-done");
    hd.addEventListener("click", function () { hideDone = !hideDone; hd.setAttribute("aria-pressed", String(hideDone)); render(); });
    var oa = document.getElementById("open-all");
    oa.addEventListener("click", function () { openAll = !openAll; oa.setAttribute("aria-pressed", String(openAll)); render(); });
    document.getElementById("q").addEventListener("input", function (e) { query = e.target.value.trim().toLowerCase(); render(); });

    render();
})();
</script>
</body>
