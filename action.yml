name: CodeFerret
description: Like CodeRabbit, but it uses your Claude subscription, and goes even deeper.
author: pocketarc

branding:
    icon: search
    color: orange

inputs:
    claude-code-oauth-token:
        description: Claude Code OAuth token. Create one with `claude setup-token`.
        required: true
    lenses:
        description: |
            Newline-separated lens names, one per line. A name resolves either to a skill
            bundled with this action or to one in the calling repository's own
            .claude/skills/, so a repository can add its own lens without forking this
            action.
        required: false
        default: |
            static-analysis
            caveman-review
            mattpocock-code-review
            anthropic-code-review
            wshobson-code-review-excellence
            cursor-thermo-nuclear-review
            sentry-security-review
            copilot-security-review
            vercel-next-best-practices
            copilot-web-design-reviewer
            copilot-sql-code-review
            anthropic-accessibility-review
            comment-review
            writing-review
    tools:
        description: |
            Space-separated static analysis tools to run before the review, naming files
            in the action's review/tools/. Their reports go to the `static-analysis`
            lens, which reads each finding against the code and decides which hold, so
            name that lens in `lenses` as well. A tool runs from the runner's own binary
            if there is one and a pinned container otherwise; with neither, it records
            that and is skipped. Set it to an empty string to run none.
        required: false
        default: |
            semgrep
            osv-scanner
    exclude-paths:
        description: |
            Newline-separated globs to keep out of the review, one per line. These become
            a git pathspec on the diff every lens reads, so an excluded file is not in the
            diff at all. A glob matches from the repository root, so `build/**` matches a
            top-level build directory and `**/build/**` matches one at any depth. The
            second form also matches an App Router `app/build/` route. Set to an empty
            string to review everything.
        required: false
        default: |
            **/*.lock
            **/*.lockb
            bun.lock
            package-lock.json
            yarn.lock
            composer.lock
            node_modules/**
            vendor/**
            **/.next/**
            **/dist/**
            out/**
            build/**
            **/*.min.js
            **/*.min.css
            **/*.snap
    base-ref:
        description: Ref to diff against. Defaults to the pull request's base branch.
        required: false
        default: ''
    model:
        description: Model for the orchestrator and every lens.
        required: false
        default: opus
    command-prefix:
        description: |
            Prefix for the `claude` and `bun` invocations, for repositories that run their
            toolchain in a container rather than on the runner. For example
            `docker compose exec -T -w /app devtools`. The prefix must put both binaries on
            PATH, mount the checkout, and start in the repository root, because the review
            reads the working tree and runs `git diff`. Leave empty to run on the runner.
        required: false
        default: ''
    github-token:
        description: "Token used to post the review. Needs `pull-requests: write` permission."
        required: false
        default: ${{ github.token }}
    pr-number:
        description: Pull request to review. Defaults to the one that triggered the run.
        required: false
        default: ''
    head-sha:
        description: Commit to anchor comments against. Defaults to the pull request head.
        required: false
        default: ''
    checkout:
        description: |
            Whether to check the repository out. 'auto' checks out the pull request head
            with full history, but only when the workspace has no checkout yet, so it can
            never clean away work an earlier step produced. 'skip' never checks out; use
            it when you check out yourself, or need submodules, LFS, or a sparse checkout.
        required: false
        default: auto
    install:
        description: |
            Whether to install the toolchain. 'auto' installs bun and claude globally via
            npm when they are not already on PATH. 'skip' assumes the caller has provided
            both, which is also the right choice if you would rather pin those versions
            yourself than let a job holding your OAuth token install the latest. Ignored
            when command-prefix is set, since that prefix owns its own toolchain.
        required: false
        default: auto
    post:
        description: Set to 'false' to run the review and skip posting it.
        required: false
        default: 'true'

outputs:
    findings-file:
        description: Path to the merged findings JSON.
        value: ${{ steps.review.outputs.findings-file }}
    findings-count:
        description: Number of merged findings.
        value: ${{ steps.review.outputs.findings-count }}
    cost-usd:
        description: What the run cost in US dollars, across the orchestrator and every lens.
        value: ${{ steps.review.outputs.cost-usd }}
    output-tokens:
        description: Output tokens across the orchestrator and every lens.
        value: ${{ steps.review.outputs.output-tokens }}

runs:
    using: composite
    steps:
        # actions/checkout cleans by default, deleting whatever an earlier step in the
        # caller's job wrote.
        - name: Check for an existing checkout
          id: probe
          shell: bash
          run: |
              if [ -d "$GITHUB_WORKSPACE/.git" ]; then
                  echo "present=true" >>"$GITHUB_OUTPUT"
                  echo "workspace already contains a checkout, leaving it alone"
              else
                  echo "present=false" >>"$GITHUB_OUTPUT"
              fi

        - name: Check out the head commit
          if: inputs.checkout != 'skip' && steps.probe.outputs.present == 'false'
          uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
          with:
              fetch-depth: 0
              ref: ${{ github.event.pull_request.head.sha }}
              token: ${{ inputs.github-token }}

        - name: Install the toolchain
          if: inputs.install != 'skip' && inputs.command-prefix == ''
          shell: bash
          run: |
              need=""
              command -v bun >/dev/null 2>&1 || need="$need bun"
              command -v claude >/dev/null 2>&1 || need="$need @anthropic-ai/claude-code"

              if [ -z "$need" ]; then
                  echo "bun and claude are already on PATH"
                  exit 0
              fi

              echo "installing:$need"
              npm install -g $need

        - name: Resolve the review target
          id: target
          shell: bash
          env:
              BASE_REF: ${{ inputs.base-ref }}
              DEFAULT_BASE: ${{ github.event.pull_request.base.ref }}
              PR_NUMBER: ${{ inputs.pr-number }}
              HEAD_SHA: ${{ inputs.head-sha }}
              DEFAULT_PR: ${{ github.event.pull_request.number }}
              DEFAULT_HEAD: ${{ github.event.pull_request.head.sha }}
          run: |
              if [ -n "$BASE_REF" ]; then
                  base="$BASE_REF"
              elif [ -n "$DEFAULT_BASE" ]; then
                  base="origin/$DEFAULT_BASE"
              else
                  echo "no base-ref given and this is not a pull_request event" >&2
                  exit 1
              fi

              if [ -f "$(git rev-parse --git-dir)/shallow" ]; then
                  git fetch --unshallow --no-tags origin || true
              fi
              if [ -n "$DEFAULT_BASE" ]; then
                  git fetch --no-tags origin "$DEFAULT_BASE" || true
              fi

              if ! git rev-parse --verify --quiet "$base" >/dev/null; then
                  echo "base ref '$base' does not resolve in this checkout" >&2
                  exit 1
              fi

              echo "base=$base" >>"$GITHUB_OUTPUT"
              echo "pr=${PR_NUMBER:-$DEFAULT_PR}" >>"$GITHUB_OUTPUT"
              echo "head=${HEAD_SHA:-$DEFAULT_HEAD}" >>"$GITHUB_OUTPUT"

        # review/run.sh is what /codeferret:review runs too. A review is one sequence of
        # steps, and keeping one copy of it is the only thing that stops the two drifting.
        - name: Run the review
          id: review
          shell: bash
          env:
              CLAUDE_CODE_OAUTH_TOKEN: ${{ inputs.claude-code-oauth-token }}
              GITHUB_TOKEN: ${{ inputs.github-token }}
              GITHUB_REPOSITORY: ${{ github.repository }}
              PREFIX: ${{ inputs.command-prefix }}
              MODEL: ${{ inputs.model }}
              LENSES: ${{ inputs.lenses }}
              TOOLS: ${{ inputs.tools }}
              EXCLUDE_PATHS: ${{ inputs.exclude-paths }}
              BASE: ${{ steps.target.outputs.base }}
              PR: ${{ steps.target.outputs.pr }}
              # A disposable runner is what bypassPermissions is for, and a classifier
              # that refused a lens mid-review would narrow it for the price of a full
              # one. On somebody's own machine /codeferret:review passes `auto` instead.
              PERMISSION_MODE: bypassPermissions
          run: |
              out="$RUNNER_TEMP/codeferret/build"

              # A failed run is when its cost and its refusal count matter most, so the
              # exit code is held until everything the run did manage to write is out.
              status=0
              bash "$GITHUB_ACTION_PATH/review/run.sh" \
                  "$BASE" \
                  "$GITHUB_ACTION_PATH" \
                  "$RUNNER_TEMP/codeferret" \
                  "$GITHUB_WORKSPACE" || status=$?

              emit() {
                  if [ -f "$out/$1" ]; then
                      echo "$1=$(cat "$out/$1")" >>"$GITHUB_OUTPUT"
                  fi
              }

              if [ -f "$out/findings.json" ]; then
                  echo "findings-file=$out/findings.json" >>"$GITHUB_OUTPUT"
              fi

              emit findings-count
              emit cost-usd
              emit output-tokens

              # Otherwise what a review cost is only visible by downloading an artifact,
              # which nobody does until the bill arrives.
              if [ -f "$out/cost-usd" ]; then
                  {
                      printf '### CodeFerret\n\n'
                      printf '| | |\n|---|---|\n'
                      printf '| Findings | %s |\n' "$(cat "$out/findings-count")"
                      printf '| Cost | $%s |\n' "$(cat "$out/cost-usd")"
                      printf '| Output tokens | %s |\n' "$(cat "$out/output-tokens")"
                      printf '| Wall clock | %s min |\n' "$(( $(cat "$out/duration-ms") / 60000 ))"

                      denied=$(cat "$out/permission-denials")
                      if [ "$denied" != "0" ]; then
                          printf '\n> %s tool call(s) were refused, so a lens reviewed less than it appears to.\n' "$denied"
                      fi

                      if [ "$status" != "0" ]; then
                          printf '\n> The review failed after this point. Read the step log.\n'
                      fi
                  } >>"$GITHUB_STEP_SUMMARY"
              fi

              exit "$status"

        - name: Post the review
          # The step above fails on anything run.sh could not finish, and the findings
          # shape check is the last thing it runs. A review that is already written and
          # already paid for is worth posting even then, so the condition here is the
          # findings file rather than the exit code. The run still ends red.
          if: ${{ !cancelled() && inputs.post != 'false' && steps.review.outputs.findings-file != '' }}
          shell: bash
          env:
              GITHUB_TOKEN: ${{ inputs.github-token }}
              GITHUB_REPOSITORY: ${{ github.repository }}
              PREFIX: ${{ inputs.command-prefix }}
              BASE: ${{ steps.target.outputs.base }}
              PR: ${{ steps.target.outputs.pr }}
              HEAD: ${{ steps.target.outputs.head }}
              EXCLUDE_PATHS: ${{ inputs.exclude-paths }}
          run: |
              if [ -z "$PR" ] || [ -z "$HEAD" ]; then
                  echo "pr-number and head-sha are required outside a pull_request event" >&2
                  exit 1
              fi

              $PREFIX bun "$GITHUB_ACTION_PATH/review/post-review.ts" \
                  "$RUNNER_TEMP/codeferret/build/findings.json" \
                  "$BASE" "$HEAD" "$PR"
