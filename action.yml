name: CodeFerret
description: Like CodeRabbit, but it uses your Claude subscription, and goes even deeper.
author: pocketarc

branding:
    icon: search
    color: orange

inputs:
    claude-code-oauth-token:
        description: Claude Code OAuth token. Create one with `claude setup-token`.
        required: true
    lenses:
        description: |
            Newline-separated lens names, one per line. A name resolves either to a skill
            bundled with this action or to one in the calling repository's own
            .claude/skills/, so a repository can add its own lens without forking this
            action.
        required: false
        default: |
            static-analysis
            caveman-review
            mattpocock-code-review
            anthropic-code-review
            wshobson-code-review-excellence
            cursor-thermo-nuclear-review
            sentry-security-review
            copilot-security-review
            vercel-next-best-practices
            copilot-web-design-reviewer
            copilot-sql-code-review
            anthropic-accessibility-review
            comment-review
            writing-review
    tools:
        description: |
            Newline-separated static analysis tools to run before the review, one per
            line, naming files in the action's review/tools/. Their reports go to the
            `static-analysis` lens, which reads each finding against the code and decides
            which hold, so name that lens in `lenses` as well. Set it to an empty string
            to run none.

            A tool runs from the runner's own binary if there is one and from a pinned
            container otherwise. With neither, it records that and is skipped. A runner
            with neither docker nor the binaries gets two skipped reports. A runner with
            docker pulls two images. The semgrep image is about 420MB.

            Both tools reach the network. semgrep fetches its `p/default` ruleset from
            semgrep's registry unless SEMGREP_CONFIG names a repository-relative one, and
            osv-scanner sends the package names and versions from each changed lockfile to
            osv.dev. Run neither if a private repository's dependency list should not
            leave the runner.

            The tools run under `command-prefix` when one is set, and they need git and
            docker rather than the repository's own toolchain. Set this to an empty string
            and drop `static-analysis` from `lenses` if that prefix has neither.
        required: false
        default: |
            semgrep
            osv-scanner
    exclude-paths:
        description: |
            Newline-separated globs to keep out of the review, one per line. These become
            a git pathspec on the diff every lens reads, so an excluded file is not in the
            diff at all. A glob matches the whole path from the repository root, so
            `build/**` covers a top-level build directory and `**/build/**` covers one at
            any depth, the top-level one included. Set to an empty string to review
            everything.

            The defaults below are split by depth, because `out` and `build` are also
            source directory names. `.next`, `dist`, the lockfiles and the minified and
            snapshot files are matched at any depth. `out` and `build` are matched at the
            repository root and one level inside `apps/` and `packages/`, because both are
            legal App Router route segments and the any-depth form hides `app/build/` from
            every lens. `dist` stays at any depth: it is a packaging convention rather than
            a word anybody routes on. Add your own workspace directory here if it is
            neither `apps/` nor `packages/`.
        required: false
        default: |
            **/*.lock
            **/*.lockb
            package-lock.json
            node_modules/**
            vendor/**
            **/.next/**
            **/dist/**
            out/**
            build/**
            apps/*/out/**
            apps/*/build/**
            packages/*/out/**
            packages/*/build/**
            **/*.min.js
            **/*.min.css
            **/*.snap
    base-ref:
        description: Ref to diff against. Defaults to the pull request's base branch.
        required: false
        default: ''
    model:
        description: Model for the orchestrator and every lens.
        required: false
        default: opus
    effort:
        description: |
            Reasoning effort for the orchestrator and every lens: low, medium, high,
            xhigh or max. Empty leaves the model's own default. Turning it down changes
            review quality as much as it changes the bill. Measure a run before you settle
            on a level. The findings file records what each lens returned.
        required: false
        default: ''
    command-prefix:
        description: |
            Prefix for the `claude` and `bun` invocations, for repositories that run their
            toolchain in a container rather than on the runner. For example
            `docker compose exec -T -w /app devtools`. The prefix must put both binaries on
            PATH, mount the checkout, and start in the repository root, because the review
            reads the working tree and runs `git diff`. Leave empty to run on the runner.
        required: false
        default: ''
    github-token:
        description: "Token used to post the review. Needs `pull-requests: write` permission."
        required: false
        default: ${{ github.token }}
    own-login:
        description: |
            The GitHub login the review posts under, which is how a run tells its own
            threads from a person's and so which ones it may resolve. Empty means
            `github-actions`, which is right for the default `github-token`. Set it to
            match whenever `github-token` is a personal access token or a GitHub App.
            Otherwise the run treats every thread as somebody else's and resolves none.
        required: false
        default: ''
    resolve-threads:
        description: |
            Whether the review may close its own threads once their defect is gone. Set it
            to 'false' alongside `contents: read`, which is what the shipped workflow
            grants: `resolveReviewThread` needs `contents: write`, so on read the
            orchestrator spends a step of the run deciding which threads are finished and
            every one of those decisions is then refused.
        required: false
        default: 'true'
    pr-number:
        description: Pull request to review. Defaults to the one that triggered the run.
        required: false
        default: ''
    head-sha:
        description: Commit the review is recorded against. Defaults to the pull request head.
        required: false
        default: ''
    checkout:
        description: |
            Whether to check the repository out. 'auto' checks out the pull request head
            with full history, but only when the workspace has no checkout yet, so it can
            never clean away work an earlier step produced. 'skip' never checks out. Use
            it when you check out yourself, or need submodules, LFS, or a sparse checkout.
        required: false
        default: auto
    install:
        description: |
            Whether to install the toolchain. 'auto' installs bun and claude globally via
            npm when they are not already on PATH. 'skip' assumes the caller has provided
            both, which is also the right choice if you would rather pin those versions
            yourself than let a job holding your OAuth token install the latest. Ignored
            when command-prefix is set, since that prefix owns its own toolchain.
        required: false
        default: auto
    post:
        description: Set to 'false' to run the review and skip posting it.
        required: false
        default: 'true'
    artifact-path:
        description: |
            What to keep as the `codeferret-run` artifact, relative to the run's build
            directory. The next run reads the findings file back out of it to know what
            this one already said. On the default a finding is raised once rather than on
            every push, and that read needs `actions: read`.

            The name is not configurable. A later run looks for `codeferret-run` and
            nothing else.

            Set it to '.' to keep the whole build directory while debugging a run, then
            put it back. Beside the findings sits run.json, the orchestrator's final
            result object, which is not secret-masked and whose prose quotes the diff.
            Anyone can download an artifact from a public repository.

            Set it to an empty string to upload nothing. Every finding is then raised
            again on every push.
        required: false
        default: findings.json

outputs:
    findings-file:
        description: Path to the merged findings JSON.
        value: ${{ steps.review.outputs.findings-file }}
    findings-count:
        description: Number of merged findings.
        value: ${{ steps.review.outputs.findings-count }}
    cost-usd:
        description: |
            What the run cost in US dollars, across the orchestrator and every lens.
            `unknown` when the run log carried no cost.
        value: ${{ steps.review.outputs.cost-usd }}
    output-tokens:
        description: Output tokens across the orchestrator and every lens.
        value: ${{ steps.review.outputs.output-tokens }}

runs:
    using: composite
    steps:
        # actions/checkout cleans by default, deleting whatever an earlier step in the
        # caller's job wrote.
        - name: Check for an existing checkout
          id: probe
          shell: bash
          run: |
              if [ -d "$GITHUB_WORKSPACE/.git" ]; then
                  echo "present=true" >>"$GITHUB_OUTPUT"
                  echo "workspace already contains a checkout, leaving it alone"
              else
                  echo "present=false" >>"$GITHUB_OUTPUT"
              fi

        # `head-sha` before the event, because outside a `pull_request` event the event
        # value is empty and actions/checkout falls back to the default branch. A
        # workflow_dispatch run passing base-ref, pr-number and head-sha then had every
        # lens review the wrong tree, and the review was posted against a commit holding
        # none of what it described, after the whole thing had been paid for.
        - name: Check out the head commit
          if: inputs.checkout != 'skip' && steps.probe.outputs.present == 'false'
          uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
          with:
              fetch-depth: 0
              ref: ${{ inputs.head-sha || github.event.pull_request.head.sha }}
              token: ${{ inputs.github-token }}

        - name: Install the toolchain
          if: inputs.install != 'skip' && inputs.command-prefix == ''
          shell: bash
          run: |
              need=""
              command -v bun >/dev/null 2>&1 || need="$need bun"
              command -v claude >/dev/null 2>&1 || need="$need @anthropic-ai/claude-code"

              if [ -z "$need" ]; then
                  echo "bun and claude are already on PATH"
                  exit 0
              fi

              echo "installing:$need"

              # shellcheck disable=SC2086 # unquoted, so the list splits into arguments
              npm install -g $need

        - name: Resolve the review target
          id: target
          shell: bash
          env:
              BASE_REF: ${{ inputs.base-ref }}
              DEFAULT_BASE: ${{ github.event.pull_request.base.ref }}
              PR_NUMBER: ${{ inputs.pr-number }}
              HEAD_SHA: ${{ inputs.head-sha }}
              DEFAULT_PR: ${{ github.event.pull_request.number }}
              DEFAULT_HEAD: ${{ github.event.pull_request.head.sha }}
          run: |
              if [ -n "$BASE_REF" ]; then
                  base="$BASE_REF"
              elif [ -n "$DEFAULT_BASE" ]; then
                  base="origin/$DEFAULT_BASE"
              else
                  echo "no base-ref given and this is not a pull_request event" >&2
                  exit 1
              fi

              if [ -f "$(git rev-parse --git-dir)/shallow" ]; then
                  git fetch --unshallow --no-tags origin || true
              fi
              if [ -n "$DEFAULT_BASE" ]; then
                  git fetch --no-tags origin "$DEFAULT_BASE" || true
              fi

              if ! git rev-parse --verify --quiet "$base" >/dev/null; then
                  echo "base ref '$base' does not resolve in this checkout" >&2
                  exit 1
              fi

              {
                  echo "base=$base"
                  echo "pr=${PR_NUMBER:-$DEFAULT_PR}"
                  echo "head=${HEAD_SHA:-$DEFAULT_HEAD}"
              } >>"$GITHUB_OUTPUT"

        - name: Run the review
          id: review
          shell: bash
          env:
              CLAUDE_CODE_OAUTH_TOKEN: ${{ inputs.claude-code-oauth-token }}
              GITHUB_TOKEN: ${{ inputs.github-token }}
              GITHUB_REPOSITORY: ${{ github.repository }}
              PREFIX: ${{ inputs.command-prefix }}
              MODEL: ${{ inputs.model }}
              EFFORT: ${{ inputs.effort }}
              LENSES: ${{ inputs.lenses }}
              TOOLS: ${{ inputs.tools }}
              EXCLUDE_PATHS: ${{ inputs.exclude-paths }}
              BASE: ${{ steps.target.outputs.base }}
              PR: ${{ steps.target.outputs.pr }}
              OWN_LOGIN: ${{ inputs.own-login }}
              RESOLVE_THREADS: ${{ inputs.resolve-threads == 'false' && '0' || '1' }}
              PERMISSION_MODE: bypassPermissions
          run: |
              out="$RUNNER_TEMP/codeferret/build"

              status=0
              bash "$GITHUB_ACTION_PATH/review/run.sh" \
                  "$BASE" \
                  "$GITHUB_ACTION_PATH" \
                  "$RUNNER_TEMP/codeferret" \
                  "$GITHUB_WORKSPACE" || status=$?

              # In the single-line `name=value` form, GitHub reads a value's second line
              # onward as more outputs to set, so the helper uses the delimiter form for
              # every file, one-line values included.
              emit() {
                  if [ -f "$out/$1" ]; then
                      {
                          printf '%s<<CF_EOF\n' "$1"
                          # cat alone would run the value into the delimiter:
                          # extract-findings.ts writes these files with no trailing newline.
                          printf '%s\n' "$(cat "$out/$1")"
                          printf 'CF_EOF\n'
                      } >>"$GITHUB_OUTPUT"
                  fi
              }

              if [ -f "$out/findings.json" ]; then
                  echo "findings-file=$out/findings.json" >>"$GITHUB_OUTPUT"
              fi

              emit findings-count
              emit cost-usd
              emit output-tokens
              emit findings-checked

              if ! $PREFIX bun "$GITHUB_ACTION_PATH/review/summary.ts" "$out" "$status" >>"$GITHUB_STEP_SUMMARY"; then
                  printf '### CodeFerret\n\nThe review failed before it could report what it had spent.\n' >>"$GITHUB_STEP_SUMMARY"
              fi

              exit "$status"

        - name: Post the review
          # The step above fails on anything run.sh could not finish. A review that is
          # already written and already paid for is worth posting even then, so the
          # condition is not that step's exit code. It is check-findings.ts having passed,
          # because a findings file that fails the shape check outright holds nothing worth
          # posting. The run still ends red either way.
          if: ${{ !cancelled() && inputs.post != 'false' && steps.review.outputs.findings-checked == 'ok' }}
          shell: bash
          env:
              GITHUB_TOKEN: ${{ inputs.github-token }}
              GITHUB_REPOSITORY: ${{ github.repository }}
              PREFIX: ${{ inputs.command-prefix }}
              PR: ${{ steps.target.outputs.pr }}
              HEAD: ${{ steps.target.outputs.head }}
          run: |
              if [ -z "$PR" ] || [ -z "$HEAD" ]; then
                  echo "pr-number and head-sha are required outside a pull_request event" >&2
                  exit 1
              fi

              # What the lenses read, which is `git rev-parse HEAD` in the workspace when
              # the run started, and need not be what the event named: under
              # `checkout: skip`, or where the probe found a checkout an earlier step
              # produced, the workspace is at whatever that step chose.
              #
              # Said rather than acted on. The review is one body with no anchored
              # comments, so the commit it is recorded against is a record and not a
              # position, and the honest-looking fix costs more than the defect: a caller
              # who checks out for themselves usually gets `refs/pull/N/merge`, a commit
              # the reviews API refuses because it is not on the pull request, and the
              # review would be lost rather than misfiled.
              reviewed=$($PREFIX bun "$GITHUB_ACTION_PATH/review/reviewed-commit.ts" \
                  "$RUNNER_TEMP/codeferret/build/diff-args" 2>/dev/null || true)

              if [ -n "$reviewed" ] && [ "$reviewed" != "$HEAD" ]; then
                  echo "the lenses read $reviewed and this review is recorded against $HEAD." >&2
                  echo "every line a finding names is a line of $reviewed." >&2
                  echo "pass head-sha, or drop checkout: skip, to make the two agree." >&2
              fi

              $PREFIX bun "$GITHUB_ACTION_PATH/review/post-review.ts" \
                  "$RUNNER_TEMP/codeferret/build/findings.json" \
                  "$HEAD" "$PR"

        # Joined here rather than in the step below, because upload-artifact refuses a
        # pattern holding `.` or `..` as a segment and the natural way to ask for the whole
        # directory is `.`. That cost a run: the review posted, `build/.` was refused, the
        # job went red, and the artifact the step exists to keep was never kept.
        - name: Resolve what to keep
          id: artifact
          if: ${{ always() && inputs.artifact-path != '' }}
          shell: bash
          env:
              ARTIFACT_PATH: ${{ inputs.artifact-path }}
          run: |
              build="$RUNNER_TEMP/codeferret/build"

              case "$ARTIFACT_PATH" in
                  *..*)
                      echo "artifact-path must stay inside the build directory: $ARTIFACT_PATH" >&2
                      exit 1
                      ;;
                  . | ./)
                      path="$build"
                      ;;
                  *)
                      path="$build/$ARTIFACT_PATH"
                      ;;
              esac

              printf 'path=%s\n' "$path" >>"$GITHUB_OUTPUT"

        # Last, and after the posting step rather than before it. `post-review.ts` writes
        # the `posted` record into the findings file once GitHub has accepted the review,
        # and a later run steps over any artifact that carries no such record: what a run
        # never said cannot be counted as said.
        #
        # Uploaded from here rather than from the caller's workflow because the name is
        # protocol between this step and the run that reads it. A consumer who holds the
        # step in their own file can rename it, drop it, or point it elsewhere, and the
        # only symptom is a review that says the same things on every push.
        #
        # `always()`, so a failed run still leaves what it had, and someone can read it by
        # hand. A failed run cannot suppress anything, because it never wrote the record.
        # The path is empty when the step above was skipped or refused what it was given.
        - name: Keep the run for inspection
          if: ${{ always() && steps.artifact.outputs.path != '' }}
          uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
          with:
              name: codeferret-run
              path: ${{ steps.artifact.outputs.path }}
              retention-days: 14
