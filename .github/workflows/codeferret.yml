name: CodeFerret

on:
    pull_request:
        types: [opened, synchronize, ready_for_review, reopened]

concurrency:
    group: codeferret-${{ github.event.pull_request.number }}
    cancel-in-progress: true

jobs:
    review:
        # The reason for each of these is in templates/workflow.yml, the same gate
        # written out for people installing CodeFerret.
        if: >-
            github.event.pull_request.draft == false &&
            github.event.pull_request.head.repo.full_name == github.repository &&
            contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.pull_request.author_association)
        runs-on: ubuntu-latest
        timeout-minutes: 60
        permissions:
            contents: read
            pull-requests: write
            actions: read

        steps:
            - name: Checkout the head commit
              uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
              with:
                  fetch-depth: 0
                  ref: ${{ github.event.pull_request.head.sha }}

            - name: CodeFerret
              uses: ./
              with:
                  claude-code-oauth-token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
                  # This repository is public, so whatever is named here is downloadable by
                  # anyone for 14 days, and an artifact's contents are not secret-masked the
                  # way a step log is. What is named here is what a maintainer reads when a
                  # review goes wrong: what it found, what the session said while finding it,
                  # and which lenses were dispatched.
                  #
                  # It was `.`, which is the whole build directory: `existing.json` and
                  # `previous.json` with it, and both carry other people's comment text.
                  #
                  # The four below are this run's own measurements rather than anybody's
                  # prose. `run.json` holds all four as fields, so leaving them out lost
                  # nothing that could not be read back; it cost the reading being a `cat`
                  # rather than a walk through JSON, and `permission-denials` is the one a
                  # maintainer reaches for when a review comes back thinner than it should.
                  artifact-path: |
                      findings.json
                      run.json
                      lens-list.txt
                      cost-usd
                      duration-ms
                      permission-denials
                      findings-checked
                  # The two lenses below are run by hand against the working tree before a
                  # push instead, because what they report is a function of how much prose the
                  # last commit wrote: on the run that followed 42 of their findings being
                  # fixed, comment-review came back with 31 more. Nothing is wrong with either
                  # lens. This branch rewrites too much prose per round for a review to be the
                  # place to catch it.
                  #
                  # Expires 2026-09-14: once that date has passed, `checkWorkflowLenses`
                  # fails this repository's own lint until somebody turns the two back on or
                  # writes down a new reason with a new date. Without it, "take this out once
                  # the diffs are small" is a judgement nobody is scheduled to make, and a
                  # lens that is off is a lens nobody is measuring.
                  #
                  # Subtracted rather than restated. `lenses` replaces the default, so the
                  # list that used to sit here went stale the moment a lens was added to
                  # action.yml, and a validator check and a map of the two names existed only
                  # to reconcile the copy.
                  exclude-lenses: |
                      comment-review
                      writing-review
