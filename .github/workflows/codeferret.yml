name: CodeFerret

on:
    pull_request:
        types: [opened, synchronize, ready_for_review, reopened]

concurrency:
    group: codeferret-${{ github.event.pull_request.number }}
    cancel-in-progress: true

jobs:
    review:
        # The reason for each of these is in templates/workflow.yml, the same gate
        # written out for people installing CodeFerret.
        if: >-
            github.event.pull_request.draft == false &&
            github.event.pull_request.head.repo.full_name == github.repository &&
            contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.pull_request.author_association)
        runs-on: ubuntu-latest
        timeout-minutes: 60
        permissions:
            contents: read
            pull-requests: write
            actions: read

        steps:
            - name: Checkout the head commit
              uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
              with:
                  fetch-depth: 0
                  ref: ${{ github.event.pull_request.head.sha }}

            - name: CodeFerret
              uses: ./
              with:
                  claude-code-oauth-token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
                  # This repository is public, so everything named in the input's
                  # description is published for 14 days to anyone who asks. Accepted: the
                  # fixture runs are what a maintainer reads when a review goes wrong.
                  artifact-path: '.'
