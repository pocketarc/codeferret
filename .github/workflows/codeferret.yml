name: CodeFerret

on:
    pull_request:
        types: [opened, synchronize, ready_for_review, reopened]

jobs:
    review:
        # `contains` over a string returns true for an empty needle, so the shorter
        # `contains('OWNER MEMBER COLLABORATOR', …)` passes when author_association is
        # absent. The array form is exact equality.
        if: contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.pull_request.author_association)
        runs-on: ubuntu-latest
        timeout-minutes: 60
        permissions:
            contents: read
            pull-requests: write

        steps:
            - name: Checkout the head commit
              uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
              with:
                  fetch-depth: 0
                  ref: ${{ github.event.pull_request.head.sha }}

            - name: CodeFerret
              uses: ./
              with:
                  claude-code-oauth-token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}

            - name: Keep the run for inspection
              if: always()
              uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
              with:
                  name: codeferret-run
                  path: ${{ runner.temp }}/codeferret/build/
                  retention-days: 14
