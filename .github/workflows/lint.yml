name: Lint

on:
    push:
    pull_request:

permissions:
    contents: read

jobs:
    # This job runs a fork's pull request code: `bun test` executes the test files as that
    # pull request has them. So it holds no secrets and no write permissions.
    #
    # Named for what it runs rather than for one of its steps. It was `manifests`, after a
    # `validate-manifests.ts` this branch deleted, so a reader who saw it go red opened
    # action.yml when the failure was a test.
    checks:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout
              uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

            # Pinned for the reason review/versions.sh gives, and the version comes out of
            # the same file the action reads, so bumping it is one edit. A stale pin fails
            # loudly; a compromised release does not.
            #
            # What the pin covers is this repository's own commits. On a fork's pull request
            # the file it sources is the fork's, so `$BUN_VERSION` is a value whoever opened
            # that pull request chose, and sourcing it is already arbitrary shell. What bounds
            # that path is the absence of secrets and write permissions above, not this line.
            - name: Install Bun
              run: |
                  # shellcheck source=review/versions.sh
                  . ./review/versions.sh
                  npm install -g "bun@$BUN_VERSION"

            - name: Validate the repository
              run: bun scripts/validate-repo.ts

            # `--ignore-scripts` because the manifest and the lockfile are the fork's too,
            # and an install script in either would otherwise run before the tests do.
            - name: Install dev dependencies
              run: bun install --frozen-lockfile --ignore-scripts

            - name: Typecheck
              run: bun run typecheck

            - name: Test
              run: bun test

    shellcheck:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout
              uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

            # SC2016 fires on every backtick inside a single-quoted printf format, and
            # these scripts write markdown into a prompt, so every SC2016 hit here is a
            # false positive.
            - name: Shellcheck
              run: shellcheck -e SC2016 review/*.sh scripts/*.sh
