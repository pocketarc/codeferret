name: Lint

on:
    push:
    pull_request:

# Neither job writes anything to GitHub, and without this they get whatever the
# repository or organisation default grants, which on an older repository is read-write.
permissions:
    contents: read

jobs:
    manifests:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout
              uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

            - name: Install Bun
              run: npm install -g bun

            - name: Validate manifests
              run: bun scripts/validate-manifests.ts

            # --ignore-scripts because this job runs on a fork's pull request against that
            # pull request's own package.json, and `trustedDependencies` is read out of
            # the same file. Without it a fork can add a package and trust it in one
            # commit, and its install script runs on the runner before tsc starts.
            - name: Install dev dependencies
              run: bun install --frozen-lockfile --ignore-scripts

            - name: Typecheck
              run: bun run typecheck

            - name: Test
              run: bun test

    shellcheck:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout
              uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

            # SC2016 fires on every backtick inside a single-quoted printf format, and
            # these scripts write markdown into a prompt, so every SC2016 hit here is a
            # false positive.
            - name: Shellcheck
              run: shellcheck -e SC2016 review/*.sh scripts/*.sh
