name: Lint

on:
    push:
    pull_request:

permissions:
    contents: read

jobs:
    # This job runs a fork's pull request code: `bun test` executes the test files as that
    # pull request has them. So it holds no secrets and no write permissions.
    manifests:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout
              uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

            # Pinned for the reason review/versions.sh gives: this job runs a fork's code,
            # and an unpinned global install runs whatever `latest` points at that morning,
            # before anything else here. A stale pin fails loudly; a compromised release does
            # not. The version comes out of the same file the action reads, so bumping it is
            # one edit.
            - name: Install Bun
              run: |
                  # shellcheck source=review/versions.sh
                  . ./review/versions.sh
                  npm install -g "bun@$BUN_VERSION"

            - name: Validate the repository
              run: bun scripts/validate-repo.ts

            # `--ignore-scripts` because the manifest and the lockfile are the fork's too,
            # and an install script in either would otherwise run before the tests do.
            - name: Install dev dependencies
              run: bun install --frozen-lockfile --ignore-scripts

            - name: Typecheck
              run: bun run typecheck

            - name: Test
              run: bun test

    shellcheck:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout
              uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

            # SC2016 fires on every backtick inside a single-quoted printf format, and
            # these scripts write markdown into a prompt, so every SC2016 hit here is a
            # false positive.
            - name: Shellcheck
              run: shellcheck -e SC2016 review/*.sh scripts/*.sh
