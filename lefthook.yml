# The same checks lint.yml runs, so a push that would go red fails here first.

pre-commit:
    parallel: true
    commands:
        repo:
            tags: repo checks
            run: bun scripts/validate-repo.ts
        typecheck:
            tags: ts types
            run: bun run typecheck
        shellcheck:
            tags: shell lint
            # shellcheck is a system package rather than something `bun install` puts here, so
            # an unguarded hook refuses every commit on a fresh clone with nothing but
            # `command not found` to go on. scripts/checks/action-shell.ts skips it for the same
            # reason. lint.yml has a shellcheck job of its own, and that is the enforcing copy.
            #
            # SC2016 for the reason .github/workflows/lint.yml passes it.
            run: |
                if ! command -v shellcheck >/dev/null 2>&1; then
                    echo "-- no shellcheck on PATH, review/*.sh and scripts/*.sh went unchecked"
                    exit 0
                fi

                shellcheck -e SC2016 review/*.sh scripts/*.sh

pre-push:
    parallel: true
    commands:
        test:
            tags: ts test
            run: bun test
